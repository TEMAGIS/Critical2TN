function updateActiveFilterBar() {
  const bar = document.getElementById('active-filters');
  const btn = document.getElementById('filter-toggle-btn');
  const chips = [];
  if (activeFilter !== 'all' && SECTORS[activeFilter]) chips.push({ kind: 'type', label: SECTORS[activeFilter].label });
  bar.innerHTML = chips.map(c =>
    `<button class="active-chip" type="button" data-clear="${c.kind}" aria-label="Remove filter: ${c.label}">${c.label}<span class="active-chip-x" aria-hidden="true">×</span></button>`
  ).join('');
  if (!bar._bound) {
    bar._bound = true;
    bar.addEventListener('click', (e) => {
      const chip = e.target.closest('.active-chip[data-clear]');
      if (!chip) return;
      if (chip.getAttribute('data-clear') === 'type') clearTypeFilter();
    });
  }
  btn.classList.toggle('has-filter', chips.length > 0);
}

function onSearch() { searchTerm = document.getElementById('search-input').value.toLowerCase(); renderList(); }
function toggleSort() {
  sortByDistance = !sortByDistance;
  document.getElementById('sort-label').textContent = sortByDistance ? '📍 Nearest first' : '🔤 A–Z';
  renderList();
}

function getFiltered() {
  let list = assets.filter(a => {
    if (activeFilter !== 'all' && sectorOf(a).key !== activeFilter) return false;
    if (searchTerm) {
      const h = `${a.name} ${a.city} ${a.county} ${a.address} ${a.assetType} ${a.sector} ${sectorOf(a).label} ${a.lifelineRaw} ${a.region}`.toLowerCase();
      if (!h.includes(searchTerm)) return false;
    }
    return true;
  });
  if (sortByDistance && userLat !== null) list.sort((a, b) => (a.distance ?? Infinity) - (b.distance ?? Infinity));
  else list.sort((a, b) => a.name.localeCompare(b.name));
  return list;
}

// ════════════════════════════════════════════════════════════════
//  LIST RENDERING
// ════════════════════════════════════════════════════════════════
function renderList() {
  updateFilterCounts();
  renderedList = getFiltered();
  document.getElementById('list-count').textContent = `${renderedList.length} asset${renderedList.length !== 1 ? 's' : ''}`;
  const c = document.getElementById('asset-list');
  if (!renderedList.length) {
    const isFiltering = activeFilter !== 'all' || searchTerm;
    if (assets.length === 0 || !isFiltering) {
      c.innerHTML = '<div class="empty-state" role="status"><div class="icon" aria-hidden="true">🏛️</div><p>No assets to display.</p></div>';
    } else {
      c.innerHTML = '<div class="empty-state" role="status"><div class="icon" aria-hidden="true">🔍</div><p>No assets match your search.<br>Try a different filter or search term.</p></div>';
    }
    return;
  }
  c.innerHTML = renderedList.map(renderCard).join('');
}

function renderCard(a) {
  const sec = sectorOf(a);
  const color = sec.color, ink = sec.ink, label = sec.label;
  const iconImg = iconHTML(sec.key, 38);
  // Distance moved from the title row into the meta-badge row so the
  // asset name has the full card width (truncates with ellipsis only
  // when names are genuinely too long, not because a 4.8-mi pill is
  // squatting in the title's space).
  const dist  = a.distance !== null ? `<span class="dist-pill">📍 ${a.distance.toFixed(1)} mi</span>` : '';
  const cityLine = [a.address, [a.city, a.state].filter(Boolean).join(', ') + (a.zip ? ` ${a.zip}` : ''), a.county ? `(${a.county} Co.)` : ''].filter(Boolean).join(' · ');
  const badges = [
    dist,
    a.lifeline ? `<span class="meta-badge lifeline" title="FEMA Community Lifeline">${escapeHtml(LIFELINES[a.lifeline].label)}</span>` : '',
  ].filter(Boolean).join('');
  const sidAttr = String(a.id).replace(/"/g, '&quot;');
  return `<article class="asset-card ${String(selectedId) === String(a.id) ? 'selected' : ''}" id="card-${a.id}"
    data-asset-id="${sidAttr}" role="listitem" tabindex="0"
    aria-label="${escapeHtml(a.name)}, ${escapeHtml(label)}, ${escapeHtml(a.city)}${a.distance !== null ? ' — ' + a.distance.toFixed(1) + ' miles away' : ''}">
    <div class="card-body">
      <div class="card-strip" style="background:${color}"></div>
      <div class="card-content">
        <div class="card-top">
          <div class="type-icon">${iconImg}</div>
          <div class="card-titles">
            <div class="card-name-row">
              <div class="card-name">${escapeHtml(a.name)}</div>
            </div>
            <div class="card-type-label" style="color:${ink}">${escapeHtml(label)}</div>
            ${a.assetType ? `<div class="card-asset-type">${escapeHtml(a.assetType)}</div>` : ''}
          </div>
        </div>
        ${cityLine ? `<div class="card-address">${escapeHtml(cityLine)}</div>` : ''}
        ${badges ? `<div class="meta-badges">${badges}</div>` : ''}
      </div>
    </div>
    <div class="card-footer">
      <button class="card-action primary" data-action="details" data-asset-id="${sidAttr}" aria-label="View details for ${escapeHtml(a.name)}">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        Details
      </button>
      <button class="card-action" data-action="directions" data-asset-id="${sidAttr}" aria-label="Get directions to ${escapeHtml(a.name)}">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
        Directions
      </button>
    </div>
  </article>`;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// ── Delegated card handlers (one listener, survives re-renders) ─
function bindListHandlers() {
  const list = document.getElementById('asset-list');
  if (!list || list._bound) return;
  list._bound = true;
  list.addEventListener('click', (e) => {
    const btn = e.target.closest('.card-action[data-asset-id]');
    if (btn) {
      e.stopPropagation();
      const id = btn.getAttribute('data-asset-id');
      if (btn.getAttribute('data-action') === 'directions') openDirections(id);
      else                                                  openDetail(id);
      return;
    }
    const card = e.target.closest('.asset-card[data-asset-id]');
    if (card) selectAsset(card.getAttribute('data-asset-id'));
  });
  list.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('.asset-card[data-asset-id]');
    if (!card || e.target !== card) return;
    e.preventDefault();
    selectAsset(card.getAttribute('data-asset-id'));
  });
}

function openDirections(id) {
  const a = getAsset(id); if (!a) return;
  const fullAddr = `${a.address}, ${a.city}, ${a.state} ${a.zip}`.trim().replace(/,\s*$/, '');
  const url = `https://maps.google.com/?q=${encodeURIComponent(fullAddr || `${a.lat},${a.lng}`)}`;
  window.open(url, '_blank', 'noopener');
}

// ════════════════════════════════════════════════════════════════
//  MAP
// ════════════════════════════════════════════════════════════════
// Cluster group — holds every asset marker and groups nearby ones into
// numbered bubbles when the map is zoomed out, so a 4,000-asset state
// like Tennessee doesn't render as a wall of overlapping pins. Markers
// break apart automatically as the user zooms in.
let clusterGroup = null;

// Two-basemap setup. Each option can be a stack of one or more tile
// layers — Hybrid is the Esri imagery service plus two transparent
// reference overlays (place labels + road network), which is the same
// recipe as AGOL's "Imagery Hybrid" basemap. All sources are public
// Esri services with no token required.
const BASEMAPS = {
  streets: {
    label: 'Streets',
    layers: [
      {
        url:         'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
        attribution: 'Tiles © Esri — Esri, DeLorme, NAVTEQ, USGS, NPS',
        maxZoom:     19,
      },
    ],
  },
  hybrid: {
    label: 'Hybrid',
    layers: [
      {
        // Satellite imagery base
        url:         'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        attribution: 'Imagery © Esri — Maxar, Earthstar Geographics, GIS User Community',
        maxZoom:     19,
      },
      {
        // Transparent place names and boundaries
        url:         'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
        attribution: '',
        maxZoom:     19,
      },
      {
        // Transparent road network (highway names, street labels)
        url:         'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',
        attribution: '',
        maxZoom:     19,
      },
    ],
  },
};
let currentBasemap = 'streets';
let basemapLayers  = [];   // tracks every tile layer the current basemap added

function applyBasemap(key) {
  if (!BASEMAPS[key]) return;
  // Tear down whatever's currently on the map
  basemapLayers.forEach(l => map.removeLayer(l));
  basemapLayers = [];
  const bm = BASEMAPS[key];
  // Add layers in array order; later layers stack visually above earlier
  // ones within Leaflet's tilePane (which itself sits below markerPane,
  // so cluster + marker overlays remain on top automatically).
  bm.layers.forEach(spec => {
    const layer = L.tileLayer(spec.url, {
      maxZoom:     spec.maxZoom,
      attribution: spec.attribution || '',
    }).addTo(map);
    basemapLayers.push(layer);
  });
  currentBasemap = key;
  // Update the toggle button label to show what the *next* tap will do
  const btn = document.getElementById('basemap-toggle');
  if (btn) {
    const next = key === 'streets' ? BASEMAPS.hybrid.label : BASEMAPS.streets.label;
    const lbl = btn.querySelector('.basemap-label');
    if (lbl) lbl.textContent = next;
    btn.setAttribute('aria-label', `Switch to ${next} basemap`);
  }
}

function toggleBasemap() {
  applyBasemap(currentBasemap === 'streets' ? 'hybrid' : 'streets');
}

function initMap() {
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView([35.85, -86.4], 7);
  applyBasemap(currentBasemap);
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.control.attribution({ position: 'bottomleft', prefix: '' }).addTo(map);
  // Custom cluster icons styled to match TEMA blue branding. Three size
  // tiers based on cluster size so a 5-asset cluster doesn't look the
  // same as a 200-asset cluster.
  clusterGroup = L.markerClusterGroup({
    showCoverageOnHover:     false,    // don't draw the polygon — looks busy
    spiderfyOnMaxZoom:       true,     // splay overlapping pins at max zoom
    disableClusteringAtZoom: 14,       // stop clustering once the user is in close
    maxClusterRadius:        55,
    chunkedLoading:          true,     // smoother first-render with thousands of pins
    iconCreateFunction(cluster) {
      const n = cluster.getChildCount();
      let size;
      if      (n >= 100) size = 56;
      else if (n >= 25)  size = 48;
      else if (n >= 10)  size = 42;
      else               size = 36;
      const fontSz = n >= 100 ? 14 : 13;
      return L.divIcon({
        className: 'cikr-cluster',
        html: `<div style="width:${size}px;height:${size}px;background:rgba(0,40,104,0.92);border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:${fontSz}px;font-family:'DM Sans',sans-serif;box-shadow:0 3px 10px rgba(0,0,0,0.35)">${n}</div>`,
        iconSize: [size, size],
      });
    },
  });
  map.addLayer(clusterGroup);
}

function refreshMarkers() {
  if (!clusterGroup) return;
  clusterGroup.clearLayers();
  markers = {};
  const layers = [];
  assets.forEach(a => {
    const sec = sectorOf(a);
    const color = sec.ink, label = sec.label;
    const popIcon = iconHTML(sec.key, 28);
    const mk = L.marker([a.lat, a.lng], { icon: makeIcon(a) })
      .bindPopup(
        `<div class="pop">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <div style="flex-shrink:0">${popIcon}</div>
            <div class="pop-name">${escapeHtml(a.name)}</div>
          </div>
          <div class="pop-type" style="color:${color}">${escapeHtml(label)}</div>
          ${a.assetType ? `<div style="font-size:11px;color:var(--text3);margin-top:2px">${escapeHtml(a.assetType)}</div>` : ''}
        </div>`,
        {
          closeButton: false,
          offset: [0, -4],
          // Auto-pan the map so popups never end up behind the on-map UI:
          // the basemap toggle pill (top-left) or the locate FAB
          // (bottom-right). Padding values are roughly the size of those
          // controls plus a comfortable margin.
          autoPan:                   true,
          autoPanPaddingTopLeft:     [130, 60],
          autoPanPaddingBottomRight: [70, 70],
        })
      .on('click', () => selectAsset(a.id));
    markers[String(a.id)] = mk;
    layers.push(mk);
  });
  // addLayers (plural) is much faster than addLayer in a loop for thousands
  // of markers — uses chunked indexing under the hood.
  clusterGroup.addLayers(layers);
}

function makeIcon(a, sel = false) {
  const sec = sectorOf(a);
  const sz = sel ? 40 : 30;
  // The CISA symbol already includes its own white ring + colored disc, so the
  // marker is just the CSS-class circle. Selection adds a sector-colored halo
  // and a bigger shadow so the active asset still pops on a busy map.
  const ring = sel
    ? `box-shadow:0 0 0 3px ${sec.color}, 0 3px 12px rgba(0,0,0,0.35)`
    : `box-shadow:0 2px 6px rgba(0,0,0,0.3)`;
  return L.divIcon({
    className: '',
    html: iconHTML(sec.key, sz, ring),
    iconSize:   [sz, sz],
    iconAnchor: [sz / 2, sz / 2],
  });
}

function selectAsset(id) {
  const a = getAsset(id); if (!a) return;
  if (selectedId && markers[String(selectedId)]) {
    const o = getAsset(selectedId);
    if (o) markers[String(selectedId)].setIcon(makeIcon(o, false));
  }
  selectedId = a.id;
  const mk = markers[String(a.id)];
  if (mk) {
    mk.setIcon(makeIcon(a, true));
    // If this marker is currently inside a cluster, zoom in until it's
    // visible, then open the popup. zoomToShowLayer is the cluster
    // plugin's helper for exactly this case — without it, openPopup()
    // on a clustered marker is a no-op.
    if (clusterGroup && clusterGroup.hasLayer(mk)) {
      clusterGroup.zoomToShowLayer(mk, () => mk.openPopup());
    } else {
      mk.openPopup();
      map.flyTo([a.lat, a.lng], Math.max(map.getZoom(), 14), { duration: 0.9 });
    }
  } else {
    map.flyTo([a.lat, a.lng], 14, { duration: 0.9 });
  }
  document.querySelectorAll('.asset-card').forEach(c => c.classList.remove('selected'));
  const card = document.getElementById('card-' + a.id);
  if (card) { card.classList.add('selected'); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
}

// ════════════════════════════════════════════════════════════════
//  GEOLOCATION
// ════════════════════════════════════════════════════════════════
function requestLocation() {
  if (!navigator.geolocation) return;
  document.getElementById('loc-label').textContent = '…';
  navigator.geolocation.getCurrentPosition(onLocationSuccess, () => {
    document.getElementById('loc-label').textContent = 'Locate';
    alert('Could not get your location. Please enable location access.');
  }, { timeout: 10000, enableHighAccuracy: true });
}

function recenterOnUser() {
  if (userLat === null || userLng === null) { requestLocation(); return; }
  map.flyTo([userLat, userLng], Math.max(map.getZoom(), 12), { duration: 0.8 });
}

function onLocationSuccess(pos) {
  userLat = pos.coords.latitude; userLng = pos.coords.longitude;
  document.getElementById('loc-label').textContent = 'Located ✓';
  if (userMarker) map.removeLayer(userMarker);
  userMarker = L.marker([userLat, userLng], {
    icon: L.divIcon({ className: '', html: '<div class="user-dot"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }),
    zIndexOffset: 1000,
  }).addTo(map);
  map.flyTo([userLat, userLng], 10, { duration: 1 });
  assets = assets.map(a => ({ ...a, distance: haversine(userLat, userLng, a.lat, a.lng) }));
  renderList();
}

function haversine(la1, lo1, la2, lo2) {
  const R = 3958.8, dL = r(la2 - la1), dO = r(lo2 - lo1);
  const A = Math.sin(dL / 2) ** 2 + Math.cos(r(la1)) * Math.cos(r(la2)) * Math.sin(dO / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(A), Math.sqrt(1 - A));
}
function r(d) { return d * Math.PI / 180; }

// ════════════════════════════════════════════════════════════════
//  DETAIL SHEET
// ════════════════════════════════════════════════════════════════
let _lastFocusBeforeDetail = null;

async function openDetail(id) {
  const a = getAsset(id); if (!a) return;
  _lastFocusBeforeDetail = document.activeElement;
  selectAsset(id);
  const sec = sectorOf(a);
  const color = sec.color, ink = sec.ink, label = sec.label;
  const bannerIcon = iconHTML(sec.key, 42);
  const desc  = sec.desc;
  const fullAddr = `${a.address}, ${a.city}, ${a.state} ${a.zip}`.trim().replace(/,\s*$/, '');
  const addrEnc  = encodeURIComponent(fullAddr || `${a.lat},${a.lng}`);
  const distLine = a.distance !== null ? `<div class="sheet-dist">📍 ${a.distance.toFixed(1)} mi away</div>` : '';

  const kvRows = [
    a.assetType   ? ['Asset Type',   a.assetType]   : null,
    a.sector      ? ['CISA Sector',  a.sector]      : null,
    a.lifeline    ? ['Lifeline',     LIFELINES[a.lifeline].label] : (a.lifelineRaw ? ['Lifeline', a.lifelineRaw] : null),
    a.component   ? ['Component',    a.component]   : null,
    a.subcomp     ? ['Subcomponent', a.subcomp]     : null,
    a.county      ? ['County',       a.county]      : null,
    a.hsipId      ? ['HSIP ID',      a.hsipId]      : null,
  ].filter(Boolean);
  const detailsSec = kvRows.length ? `
    <div class="sdiv"></div>
    <div class="sec">
      <div class="sec-label">Details</div>
      <div class="kv-grid">
        ${kvRows.map(([k, v]) => `<div class="kv-key">${escapeHtml(k)}</div><div class="kv-val">${escapeHtml(v)}</div>`).join('')}
      </div>
    </div>` : '';

  // Contact section — always rendered, even when fields are empty, so
  // users can see at a glance that the asset is missing contact info
  // and needs to be populated. Phone/email become tap-to-call /
  // tap-to-mail links when present; empty fields show a muted
  // "Not provided" placeholder.
  const phoneDigits = (a.contactPhone || '').replace(/[^\d+]/g, '');
  const empty = `<div class="kv-val kv-empty">Not provided</div>`;
  const contactRows = [
    ['Contact', a.contactName   ? `<div class="kv-val">${escapeHtml(a.contactName)}</div>`   : empty],
    ['Agency',  a.contactAgency ? `<div class="kv-val">${escapeHtml(a.contactAgency)}</div>` : empty],
    ['Phone',   a.contactPhone  ? `<a class="kv-val kv-link" href="tel:${escapeHtml(phoneDigits)}">${escapeHtml(a.contactPhone)}</a>` : empty],
    ['Email',   a.contactEmail  ? `<a class="kv-val kv-link" href="mailto:${escapeHtml(a.contactEmail)}">${escapeHtml(a.contactEmail)}</a>` : empty],
  ];
  const contactSec = `
    <div class="sdiv"></div>
    <div class="sec">
      <div class="sec-label">Contact</div>
      <div class="kv-grid">
        ${contactRows.map(([k, v]) => `<div class="kv-key">${escapeHtml(k)}</div>${v}`).join('')}
      </div>
    </div>`;

  document.getElementById('detail-body').innerHTML = `
    <div class="sheet-banner" style="background:${color}18;border:1px solid ${color}40;color:${ink};">
      ${bannerIcon}
      <div>
        <div class="banner-label" style="color:${ink}">${escapeHtml(label)}</div>
        ${desc ? `<div class="banner-desc" style="color:${ink}">${escapeHtml(desc)}</div>` : ''}
      </div>
    </div>
    <div class="sheet-header">
      <h2 class="sheet-name" id="detail-asset-name">${escapeHtml(a.name)}</h2>
      <div class="sheet-addr">${escapeHtml(a.address || '')}${a.address ? '<br>' : ''}${escapeHtml(a.city || '')}${a.city && a.state ? ', ' : ''}${escapeHtml(a.state || '')} ${escapeHtml(String(a.zip || ''))}${a.county ? ' — ' + escapeHtml(a.county) + ' County' : ''}</div>
      ${distLine}
    </div>
    ${detailsSec}
    ${contactSec}
    <div class="sdiv"></div>
    <div class="sec" id="attachments-sec">
      <div class="sec-label">Attachments</div>
      <div id="attachments-body" style="font-size:13px;color:var(--text3)">Loading…</div>
    </div>
    <div class="sdiv"></div>
    <div class="nav-btns">
      <a class="nav-btn goo" href="https://maps.google.com/?q=${addrEnc}" target="_blank" rel="noopener" aria-label="Open in Google Maps">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>Google Maps
      </a>
      <a class="nav-btn apl" href="https://maps.apple.com/?q=${addrEnc}" target="_blank" rel="noopener" aria-label="Open in Apple Maps">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>Apple Maps
      </a>
    </div>`;
  const sheet = document.getElementById('detail-sheet');
  sheet.removeAttribute('hidden');
  sheet.classList.add('open');
  setTimeout(() => { const btn = sheet.querySelector('.sheet-close-btn'); if (btn) btn.focus(); }, 50);
  sheet._keyHandler = e => {
    if (e.key === 'Escape') { closeDetail(); return; }
    if (e.key !== 'Tab') return;
    const focusables = sheet.querySelectorAll('a[href], button, input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  document.addEventListener('keydown', sheet._keyHandler);

  // Lazy-load attachments — only fetched when the detail is opened, not on
  // the initial list query (saves bandwidth on big asset sets).
  loadAttachmentsInto(a);
}

async function loadAttachmentsInto(a) {
  const box = document.getElementById('attachments-body');
  const sec = document.getElementById('attachments-sec');
  if (!box) return;
  if (sec) sec.style.display = '';
  console.info(`[Critical2TN] loading attachments for OBJECTID=${a.objectId} (${a.name})`);
  const result = await fetchAttachmentInfo(a.objectId);
  if (result.state === 'error') {
    box.innerHTML = `<div style="color:#842029;font-size:13px;line-height:1.5">${escapeHtml(result.message)}<br><span style="color:var(--text3);font-size:11px">Open browser DevTools console for details.</span></div>`;
    return;
  }
  const infos = result.infos;
  if (!infos.length) {
    box.innerHTML = '<div style="color:var(--text3);font-size:13px">No attachments for this asset.</div>';
    return;
  }
  box.innerHTML = `<div class="attachment-grid">${infos.map((att, i) => `
    <div class="attachment-tile ${att.isImage ? 'loading' : ''}" data-idx="${i}" data-url="${escapeHtml(att.url)}" data-name="${escapeHtml(att.name)}" data-type="${escapeHtml(att.contentType)}" tabindex="0" role="button" aria-label="${escapeHtml(att.name)}">
      ${att.isImage ? `<img src="${escapeHtml(att.url)}" alt="${escapeHtml(att.name)}" onload="this.parentElement.classList.remove('loading')" onerror="this.parentElement.innerHTML='<div class=\\'fileinfo\\'>📄<br><strong>'+this.alt+'</strong></div>';this.parentElement.classList.remove('loading')">` : `<div class="fileinfo">📄<br><strong>${escapeHtml(att.name)}</strong><br>${formatBytes(att.size)}</div>`}
    </div>`).join('')}</div>`;
  box.querySelectorAll('.attachment-tile').forEach(tile => {
    tile.addEventListener('click', () => {
      const url = tile.getAttribute('data-url');
      const type = tile.getAttribute('data-type');
      if (type && type.startsWith('image/')) openLightbox(url, tile.getAttribute('data-name'));
      else                                    window.open(url, '_blank', 'noopener');

    tile.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tile.click(); }
    });
  });
}

function formatBytes(n) {
  if (!n) return '';
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(0)} KB`;
  return `${(n / 1024 / 1024).toFixed(1)} MB`;
}

function closeDetail() {
  const sheet = document.getElementById('detail-sheet');
  sheet.classList.remove('open');
  setTimeout(() => sheet.setAttribute('hidden', ''), 350);
  document.removeEventListener('keydown', sheet._keyHandler);
  if (_lastFocusBeforeDetail) _lastFocusBeforeDetail.focus();
}

// ── Lightbox ───────────────────────────────────────────────────
function openLightbox(url, name) {

// ── who is this user? (scope only picks defaults; ArcGIS sharing enforces access)
let USER_SCOPE = { type: 'unknown', counties: [], groups: [] };
let refLimitCounty = true;
async function loadUserScope() {
  try {
    const res = await fetch(`https://www.arcgis.com/sharing/rest/community/self?f=json&token=${encodeURIComponent(TOKEN.accessToken)}`);
    const me = await res.json();
    const titles = (me.groups || []).map(g => String(g.title || '').trim());
    const counties = [];
    let statewide = false;
    for (const t of titles) {
      const m = /^critical2tn\s+(.+)$/i.exec(t);
      if (!m) continue;
      const rest = m[1].trim();
      if (/^statewide/i.test(rest)) statewide = true;
      else if (/^(secure mfa|staging)$/i.test(rest)) continue;
      else counties.push(rest.replace(/\s+county$/i, ''));
    }
    USER_SCOPE = {
      type: statewide ? 'statewide' : (counties.length ? 'county' : 'unknown'),
      counties: statewide ? [] : counties,
      groups: titles,
    };
    console.info('[Critical2TN] access scope:', USER_SCOPE.type, USER_SCOPE.counties);
  } catch (err) {
    console.warn('[Critical2TN] could not read group membership (layers still work, unfiltered):', err);
  }
}
function refCountyWhere(d) {
  if (!d.countyField || USER_SCOPE.type !== 'county' || !refLimitCounty || !USER_SCOPE.counties.length) return '';
  const parts = USER_SCOPE.counties.map(c => `UPPER(${d.countyField}) LIKE '${c.toUpperCase().replace(/'/g, "''")}%'`);
  return '(' + parts.join(' OR ') + ')';
}
function refWhere(d) {

// ── token only goes to Esri-hosted services
function refSendsToken(url) {

}
async function refGet(url, params, signal) {
  const send = refSendsToken(url) && TOKEN;
  const build = () => url + '?' + new URLSearchParams(send ? { ...params, token: TOKEN.accessToken } : params);
  let res = await fetch(build(), { signal });
  if (!res.ok) throw Object.assign(new Error('HTTP ' + res.status), { code: res.status });
  let json = await res.json();
  if (json.error && send && (json.error.code === 498 || json.error.code === 499) && TOKEN.refreshToken) {
    try { saveToken(await refreshAccessToken()); } catch (e) { /* fall through */ }
    res = await fetch(build(), { signal });
    json = await res.json();

  if (json.error) throw Object.assign(new Error(json.error.message || 'ArcGIS error'), { code: json.error.code });

// ── popups
const _GENERIC_SKIP = /^(objectid|fid|shape|globalid|created|creator|editor|edit|esri|oid)/i;

function fmtRef(v, kind) {

  if (kind === 'date' || (typeof v === 'number' && v > 1e11 && v < 4e12)) {
    const dt = new Date(v); return isNaN(dt) ? escapeHtml(v) : escapeHtml(dt.toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }));
  }
  if (kind === 'phone') { const dg = String(v).replace(/[^\d+]/g, ''); return `<a class="kv-link" href="tel:${escapeHtml(dg)}">${escapeHtml(v)}</a>`; }
  if (kind === 'num' || typeof v === 'number') return escapeHtml(Number(v).toLocaleString());
  const s = String(v); return escapeHtml(s.length > 140 ? s.slice(0, 137) + '…' : s);
}
function refPopupHtml(d, f, st) {
  const p = f.properties || {};
  const lower = {}; Object.keys(p).forEach(k => lower[k.toLowerCase()] = p[k]);
  let title = d.title || (d.name && p[d.name]);
  if (!title && d.generic) { for (const k of _TITLE_KEYS) { if (lower[k]) { title = lower[k]; break; } } }
  title = title || d.label;
  let rows;
  if (d.fields) rows = d.fields.map(([k, fld, kind]) => [k, fmtRef(p[fld], kind)]).filter(r => r[1]);
  else rows = Object.keys(p).filter(k => !_GENERIC_SKIP.test(k) && p[k] != null && p[k] !== '' && typeof p[k] !== 'object')
         .slice(0, 8).map(k => [k.replace(/_/g, ' '), fmtRef(p[k], /time|date|update|issued|expire/i.test(k) ? 'date' : '')]);
  let listHtml = '';
  if (d.listField && st.data && f.geometry && f.geometry.type === 'Point') {
    const [x, y] = f.geometry.coordinates;
    const vals = [...new Set(st.data.filter(g => g.geometry && g.geometry.type === 'Point' && g.geometry.coordinates[0] === x && g.geometry.coordinates[1] === y)
      .map(g => g.properties && g.properties[d.listField]).filter(Boolean))].sort();
    if (vals.length) listHtml = `<div class="ref-list"><b>${escapeHtml(d.listLabel || d.listField)} (${vals.length})</b><br>${vals.slice(0, 12).map(escapeHtml).join('<br>')}${vals.length > 12 ? `<br>+${vals.length - 12} more` : ''}</div>`;
  }

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span class="ref-dot" style="background:${d.color}"></span><div class="pop-name">${escapeHtml(title)}</div></div>
    <div class="pop-type" style="color:${d.color}">${escapeHtml(d.label)}</div>
    ${rows.map(([k, v]) => `<div class="ref-row"><span>${escapeHtml(k)}</span><span>${v}</span></div>`).join('')}${listHtml}</div>`;
}

// ── fetching (viewport only)
async function fetchRef(d, force) {
  const st = refState[d.key]; if (!st || !st.on) return;
  const z = map.getZoom();
  if (d.type === 'tiles') { refSetStatus(d.key, 'ok'); st.at = st.at || Date.now(); return; }
  if (d.minZoom && z < d.minZoom) {
    if (st.layer && st.layer.clearLayers) st.layer.clearLayers();
    [st.ov, st.pending].forEach(o => o && map.removeLayer(o)); st.ov = st.pending = null;
    st.loaded = null; st.data = null; refSetStatus(d.key, 'zoom'); return;
  }
  if (d.type === 'dynamic') return refDynamic(d, st);

  const where = refWhere(d), view = map.getBounds();
  if (!force && st.loaded && st.loaded.z === z && st.loaded.where === where && st.loaded.b.contains(view)) return;
  if (st.ctl) st.ctl.abort();
  const ctl = new AbortController(); st.ctl = ctl;
  const timer = setTimeout(() => ctl.abort(), 25000);
  if (st.status !== 'ok') refSetStatus(d.key, 'loading');
  const pad = view.pad(0.3), max = d.max || 1500;
  const params = {
    where, geometry: `${pad.getWest()},${pad.getSouth()},${pad.getEast()},${pad.getNorth()}`,
    geometryType: 'esriGeometryEnvelope', inSR: '4326', spatialRel: 'esriSpatialRelIntersects',
    outFields: '*', returnGeometry: 'true', outSR: '4326', f: 'geojson',
    resultRecordCount: String(max), geometryPrecision: '5',
  };
  if (d.geom === 'line' || d.geom === 'poly') params.maxAllowableOffset = String((360 / (256 * Math.pow(2, z))) * 1.2);
  if (d.fields) params.outFields = d.fields.map(f => f[1]).concat(d.name || [], d.listField || []).filter((v, i, a) => v && a.indexOf(v) === i).join(',');
  try {
    const json = await refGet(d.url + '/query', params, ctl.signal);
    if (st.ctl !== ctl || !st.on) return;                                // superseded or switched off meanwhile
    const feats = json.features || [];
    const capped = json.exceededTransferLimit === true || (json.properties && json.properties.exceededTransferLimit === true) || feats.length >= max;
    st.layer.clearLayers();
    st.layer.addData({ type: 'FeatureCollection', features: feats });
    st.data = feats; st.loaded = { b: pad, z, where }; st.at = Date.now();
    refSetStatus(d.key, 'ok', { n: feats.length, capped });
  } catch (err) {
    if (st.ctl !== ctl) return;                                          // superseded by a newer request
    const denied = err.code === 403 || err.code === 498 || err.code === 499 || /permission|not authorized|token/i.test(err.message || '');
    console.warn('[Critical2TN] layer', d.key, err);
    if (denied) { st.unavailable = true; st.on = false; if (st.layer) map.removeLayer(st.layer); saveRefPrefs(); refSetStatus(d.key, 'unavailable'); refUpdateUi(); renderLayersSheet(); }
    else refSetStatus(d.key, 'error');
  } finally { clearTimeout(timer); }
}

// One picture of the current view from a MapServer — no features downloaded.
function refDynamic(d, st) {
  const b = map.getBounds(), sz = map.getSize(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const p1 = L.CRS.EPSG3857.project(b.getSouthWest()), p2 = L.CRS.EPSG3857.project(b.getNorthEast());
  const url = d.mapServer + '/export?' + new URLSearchParams({
    bbox: `${p1.x},${p1.y},${p2.x},${p2.y}`, bboxSR: '3857', imageSR: '3857',
    size: `${Math.round(sz.x * dpr)},${Math.round(sz.y * dpr)}`, dpi: String(Math.round(96 * dpr)),
    format: 'png32', transparent: 'true', layers: 'show:' + d.sublayer, f: 'image',
  });
  if (st.pending) map.removeLayer(st.pending);
  const ov = L.imageOverlay(url, b, { opacity: d.opacity || 0.6, interactive: false, className: 'ref-img' });
  st.pending = ov;
  ov.once('load', () => { if (!st.on) { map.removeLayer(ov); return; } if (st.ov && st.ov !== ov) map.removeLayer(st.ov); st.ov = ov; st.pending = null; st.at = Date.now(); refSetStatus(d.key, 'ok'); });
  ov.once('error', () => { map.removeLayer(ov); if (st.pending === ov) st.pending = null; refSetStatus(d.key, 'error'); });
  ov.addTo(map);
  if (st.status !== 'ok') refSetStatus(d.key, 'loading');
}

function refreshRefLayers(force, timerTick) {
  REF_LAYERS.forEach(d => {
    const st = refState[d.key]; if (!st.on) return;
    if (timerTick) {
      if (!d.refreshMs || document.hidden || Date.now() - (st.at || 0) < d.refreshMs) return;
      if (d.type === 'tiles' && st.layer) { st.layer.options.t = st.at = Date.now(); st.layer.redraw(); return; }
      fetchRef(d, true);
    } else fetchRef(d, force);
  });
}
function refUpdateUi() {
  const n = REF_LAYERS.filter(d => refState[d.key].on).length;
  const badge = document.getElementById('layers-count');
  if (badge) { badge.textContent = n; badge.hidden = !n; }
  REF_BUNDLES.forEach(b => {
    const el = document.getElementById('rlb-' + b.key);
    if (el) { const c = REF_LAYERS.filter(d => d.bundle === b.key && refState[d.key].on).length; el.textContent = c ? `${c} on` : ''; }
  });
}

// ── bottom sheet

function _layersKey(e) { if (e.key === 'Escape') closeLayersSheet(); }
function openLayersSheet() {

async function initRefLayers() {
  map.createPane('refPane').style.zIndex = 450;                 // above basemap/overlays, below the core markers
  refRenderer = L.canvas({ pane: 'refPane', padding: 0.4, tolerance: 8 });
  REF_LAYERS.forEach(d => { refState[d.key] = { on: false, status: 'off', n: 0 }; });
  const prefs = loadRefPrefs();
  if (prefs && typeof prefs.limitCounty === 'boolean') refLimitCounty = prefs.limitCounty;
  map.on('moveend', () => { clearTimeout(refDebounce); refDebounce = setTimeout(() => refreshRefLayers(false), 350); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshRefLayers(false, true); });
  if (refTimer) clearInterval(refTimer);
  refTimer = setInterval(() => refreshRefLayers(false, true), 60000);
  refUpdateUi();
  // Learn the user's scope first (max 2.5 s) so a county user's first request is already filtered.
  await Promise.race([loadUserScope(), new Promise(r => setTimeout(r, 2500))]);
  if (prefs && Array.isArray(prefs.on)) prefs.on.forEach(k => REF_BY_KEY[k] && setRefLayerOn(k, true, { silent: true }));
  refUpdateUi();
}

// ════════════════════════════════════════════════════════════════
//  DRAW AN AREA → EXPORT CSV  (Critical2TN assets + Tier II)
//  --------------------------------------------------------------
//   • Draw a polygon, rectangle or circle on the map.
//   • Critical2TN assets inside it come from the data already loaded
//     (instant, works offline). Tier II is queried from the service with
//     the shape itself, so it does not depend on the current zoom/view.
//   • Only what the signed-in account can already read can be exported —
//     ArcGIS sharing still decides that (county users: their county).
//   • One CSV, one row per Critical2TN asset and one row per Tier II
//     chemical record, with a 'dataset' column. UTF-8 with BOM so Excel
//     opens it cleanly; text cells that could run as a spreadsheet formula
//     are neutralised.
//   • Capped (EXPORT_CAP) and blocked above it — never silently truncated.
// ════════════════════════════════════════════════════════════════
const EXPORT_CAP = 5000;
const EXPORT_NOTICE = 'SENSITIVE - Critical infrastructure information. Handle and share per TEMA/OHS policy.';
const T2_FIELDS = ['OBJECTID','FacilityId','State_Facility_ID','FacilityName','Company_Name','Filing_Year','Filing_Type','Street','City','County','State','Zip',
                   'Latitude','Longitude','ChemicalName','CASNumber','MaxDailyQty','AvgDailyQty','MaxAmountInLargestContainer','EHS','ContactInfo'];

const drawState = { mode: 'off', shape: null, pts: [], layer: null, ring: null, ctl: null,
                    core: [], coreOff: new Set(), t2: [], t2Status: 'idle', t2Off: false, areaSqMi: 0, busy: false };

// ── geometry helpers
function ringFromCircle(center, radiusM, n = 72) {
  const R = 6378137, lat1 = center.lat * Math.PI / 180, lon1 = center.lng * Math.PI / 180, ring = [];
  for (let i = 0; i < n; i++) {
    const brg = (i / n) * 2 * Math.PI, d = radiusM / R;
    const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(brg));
    const lon2 = lon1 + Math.atan2(Math.sin(brg) * Math.sin(d) * Math.cos(lat1), Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));
    ring.push([lon2 * 180 / Math.PI, lat2 * 180 / Math.PI]);
  }
  return ring;
}
function pointInRing(x, y, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function ringAreaSqMi(ring) {
  const P = ll => L.CRS.EPSG3857.project(L.latLng(ll[1], ll[0]));
  let s = 0; const pts = ring.map(P);
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) s += (pts[j].x * pts[i].y) - (pts[i].x * pts[j].y);
  const lat = ring.reduce((a, p) => a + p[1], 0) / ring.length, k = Math.cos(lat * Math.PI / 180);
  return Math.abs(s / 2) * k * k / 2589988.11;
}

// ── drawing UI
function initDraw() {
  drawState.layer = L.layerGroup().addTo(map);
  map.on('click', onDrawClick);
  renderDrawBar();
}
function drawRender() {
  const g = drawState.layer; g.clearLayers();
  const style = { color: '#BF0A30', weight: 3, dashArray: '7 6', fillColor: '#BF0A30', fillOpacity: 0.12, interactive: false };
  if (drawState.ring) {
    L.polygon(drawState.ring.map(p => [p[1], p[0]]), { ...style, dashArray: null }).addTo(g);
    return;
  }
  const pts = drawState.pts;
  if (drawState.shape === 'polygon') {
    if (pts.length >= 3) L.polygon(pts, style).addTo(g); else if (pts.length === 2) L.polyline(pts, style).addTo(g);
  }
  pts.forEach((p, i) => L.circleMarker(p, { radius: i === 0 ? 8 : 6, color: '#fff', weight: 2, fillColor: '#BF0A30', fillOpacity: 1, interactive: false }).addTo(g));
}
function setDrawMode(mode, shape) {
  drawState.mode = mode;
  if (shape !== undefined) drawState.shape = shape;
  window.__drawing = mode === 'drawing';
  document.getElementById('map').classList.toggle('drawing', mode === 'drawing');
  map.doubleClickZoom[mode === 'drawing' ? 'disable' : 'enable']();
  if (mode === 'drawing') map.closePopup();
  renderDrawBar();
}
function toggleDraw() {
  if (drawState.mode === 'off') setDrawMode('choose');
  else cancelDraw();
}
function cancelDraw() {
  if (drawState.ctl) drawState.ctl.abort();
  drawState.pts = []; drawState.ring = null; drawState.shape = null; drawState.t2 = []; drawState.core = [];
  drawState.layer.clearLayers();
  closeExportSheet(true);
  setDrawMode('off');
}
function startShape(shape) { drawState.pts = []; drawState.ring = null; drawRender(); setDrawMode('drawing', shape); }
function undoPoint() { drawState.pts.pop(); drawRender(); renderDrawBar(); }
function onDrawClick(e) {
  if (drawState.mode !== 'drawing') return;
  drawState.pts.push(e.latlng);
  const pts = drawState.pts;
  if (drawState.shape === 'rectangle' && pts.length === 2) {
    const b = L.latLngBounds(pts[0], pts[1]);
    return finishShape([[b.getWest(), b.getSouth()], [b.getEast(), b.getSouth()], [b.getEast(), b.getNorth()], [b.getWest(), b.getNorth()]]);
  }
  if (drawState.shape === 'circle' && pts.length === 2) {
    const r = pts[0].distanceTo(pts[1]);
    if (r < 20) { drawState.pts.pop(); return; }
    return finishShape(ringFromCircle(pts[0], r));
  }
  drawRender(); renderDrawBar();
}
function finishPolygon() {
  if (drawState.pts.length < 3) return;
  finishShape(drawState.pts.map(p => [p.lng, p.lat]));
}
function finishShape(ring) {
  drawState.ring = ring; drawState.pts = [];
  drawState.areaSqMi = ringAreaSqMi(ring);
  drawRender(); setDrawMode('done');
  runExportQuery(); openExportSheet();
}
function renderDrawBar() {
  const bar = document.getElementById('draw-bar'), btn = document.getElementById('draw-toggle');
  if (!bar) return;
  const m = drawState.mode, n = drawState.pts.length;
  if (btn) btn.classList.toggle('on', m !== 'off');
  bar.hidden = m === 'off';
  const b = (label, fn, cls = '') => `<button type="button" class="db ${cls}" onclick="${fn}">${label}</button>`;
  let html = '';
  if (m === 'choose') html = `<span class="dmsg">Pick a shape</span>${b('Polygon', "startShape('polygon')")}${b('Rectangle', "startShape('rectangle')")}${b('Circle', "startShape('circle')")}${b('Cancel', 'cancelDraw()', 'ghost')}`;
  if (m === 'drawing') {
    const msg = drawState.shape === 'polygon' ? (n < 3 ? `Tap the map to add corners (${n}/3 min)` : `${n} corners — tap more, or Finish`)
              : drawState.shape === 'rectangle' ? (n ? 'Tap the opposite corner' : 'Tap one corner')
              : (n ? 'Tap to set the edge of the circle' : 'Tap the center');
    html = `<span class="dmsg">${msg}</span>${n ? b('Undo', 'undoPoint()') : ''}${drawState.shape === 'polygon' && n >= 3 ? b('Finish', 'finishPolygon()', 'pri') : ''}${b('Cancel', 'cancelDraw()', 'ghost')}`;
  }
  if (m === 'done') html = `${b('Export…', 'openExportSheet()', 'pri')}${b('Redraw', "setDrawMode('choose')")}${b('Clear', 'cancelDraw()', 'ghost')}`;
  bar.innerHTML = html;
}

// ── data inside the shape
function coreInShape() {
  const ring = drawState.ring; if (!ring) return [];
  let w = 180, e = -180, s = 90, n = -90;
  ring.forEach(p => { w = Math.min(w, p[0]); e = Math.max(e, p[0]); s = Math.min(s, p[1]); n = Math.max(n, p[1]); });
  return assets.filter(a => a.lng >= w && a.lng <= e && a.lat >= s && a.lat <= n && pointInRing(a.lng, a.lat, ring));
}
async function refPost(url, params, signal) {
  const send = refSendsToken(url) && TOKEN;
  const body = () => new URLSearchParams(send ? { ...params, token: TOKEN.accessToken } : params);
  let res = await fetch(url, { method: 'POST', body: body(), signal });
  if (!res.ok) throw Object.assign(new Error('HTTP ' + res.status), { code: res.status });
  let json = await res.json();
  if (json.error && send && (json.error.code === 498 || json.error.code === 499) && TOKEN.refreshToken) {
    try { saveToken(await refreshAccessToken()); } catch (e) { /* fall through */ }
    res = await fetch(url, { method: 'POST', body: body(), signal });
    json = await res.json();
  }
  if (json.error) throw Object.assign(new Error(json.error.message || 'ArcGIS error'), { code: json.error.code });
  return json;
}
async function runExportQuery() {
  if (drawState.ctl) drawState.ctl.abort();
  const ctl = new AbortController(); drawState.ctl = ctl;
  drawState.core = coreInShape(); drawState.coreOff = new Set(); drawState.t2 = []; drawState.t2Off = false;
  drawState.t2Status = 'loading'; renderExportSheet();
  const url = REF_BY_KEY.tier2.url + '/query', ring = drawState.ring;
  const base = { where: refCountyWhere(REF_BY_KEY.tier2) || '1=1', geometry: JSON.stringify({ rings: [ring.concat([ring[0]])], spatialReference: { wkid: 4326 } }),
                 geometryType: 'esriGeometryPolygon', inSR: '4326', spatialRel: 'esriSpatialRelIntersects',
                 returnGeometry: 'true', outSR: '4326', f: 'json', orderByFields: 'OBJECTID' };
  try {
    let fields = T2_FIELDS.join(','), out = [], offset = 0, more = true, guard = 12;
    while (more && guard-- > 0 && out.length <= EXPORT_CAP) {
      let json;
      try { json = await refPost(url, { ...base, outFields: fields, resultOffset: String(offset), resultRecordCount: '1000' }, ctl.signal); }
      catch (err) {                                          // a field name the service doesn't have → retry once with all fields
        if (fields !== '*' && err.code === 400) { fields = '*'; continue; }
        throw err;
      }
      const f = json.features || []; out.push(...f); offset += f.length;
      more = json.exceededTransferLimit === true && f.length > 0;
    }
    if (drawState.ctl !== ctl) return;
    drawState.t2 = out; drawState.t2Status = 'ok';
  } catch (err) {
    if (drawState.ctl !== ctl) return;
    const denied = err.code === 403 || err.code === 498 || err.code === 499 || /permission|not authorized|token/i.test(err.message || '');
    console.warn('[Critical2TN] Tier II export query failed', err);
    drawState.t2Status = denied ? 'unavailable' : 'error';
  }
  renderExportSheet();
}

// ── export sheet
function exportSelection() {
  const core = drawState.core.filter(a => !drawState.coreOff.has(sectorOf(a).key));
  const t2 = drawState.t2Off || drawState.t2Status !== 'ok' ? [] : drawState.t2;
  return { core, t2, total: core.length + t2.length };
}
function renderExportSheet() {
  const body = document.getElementById('export-body'); if (!body) return;
  const sel = exportSelection(), over = sel.total > EXPORT_CAP;
  const bySector = {}; drawState.core.forEach(a => { const k = sectorOf(a).key; bySector[k] = (bySector[k] || 0) + 1; });
  const t2Fac = new Set(drawState.t2.map(f => { const p = f.attributes || {}; return p.FacilityId || p.State_Facility_ID || p.FacilityName; })).size;
  const t2Line = { loading: 'Checking Tier II…', unavailable: 'Not available to your account', error: 'Couldn’t reach Tier II',
                   ok: `${t2Fac.toLocaleString()} facilit${t2Fac === 1 ? 'y' : 'ies'} · ${drawState.t2.length.toLocaleString()} chemical record${drawState.t2.length === 1 ? '' : 's'}` }[drawState.t2Status] || '';
  const secRows = Object.keys(bySector).sort((a, b) => bySector[b] - bySector[a]).map(k => {
    const s = SECTORS[k] || UNKNOWN_SECTOR;
    return `<label class="ex-sec"><input type="checkbox" ${drawState.coreOff.has(k) ? '' : 'checked'} onchange="toggleExportSector('${k}', this.checked)">${iconHTML(k, 20)}<span>${escapeHtml(s.label)}</span><b>${bySector[k]}</b></label>`;
  }).join('');
  body.innerHTML = `
    <h2 id="export-title" class="rl-title">Export area</h2>
    <div class="rl-sub">${drawState.areaSqMi < 0.1 ? '< 0.1' : drawState.areaSqMi.toFixed(drawState.areaSqMi < 10 ? 1 : 0)} sq mi · only data your account can already see${refCountyWhere(REF_BY_KEY.tier2) ? ' · Tier II limited to your county' : ''}</div>
    <div class="ex-card">
      <div class="ex-head"><span>Critical2TN assets</span><b>${drawState.core.length.toLocaleString()}</b></div>
      ${secRows || '<div class="ex-none">None in this area</div>'}
    </div>
    <div class="ex-card ${drawState.t2Status === 'unavailable' ? 'dis' : ''}">
      <label class="ex-head"><span><input type="checkbox" ${drawState.t2Off || drawState.t2Status !== 'ok' ? '' : 'checked'} ${drawState.t2Status !== 'ok' ? 'disabled' : ''} onchange="toggleExportT2(this.checked)"> Tier II HAZMAT</span><b class="ex-t2" data-s="${drawState.t2Status}"></b></label>
      <div class="ex-none" data-s="${drawState.t2Status}">${escapeHtml(t2Line)}${drawState.t2Status === 'error' ? ' <button class="ex-link" onclick="runExportQuery()">Retry</button>' : ''}</div>
    </div>
    <div class="ex-total ${over ? 'over' : ''}">${over
      ? `${sel.total.toLocaleString()} rows is over the ${EXPORT_CAP.toLocaleString()}-row limit. Draw a smaller area or untick something.`
      : `${sel.total.toLocaleString()} row${sel.total === 1 ? '' : 's'} will be exported (CSV).`}</div>
    <div class="ex-btns">
      <button class="ex-pri" type="button" ${sel.total === 0 || over || drawState.t2Status === 'loading' ? 'disabled' : ''} onclick="exportCsv(true)">Share / save CSV</button>
      <button class="ex-sec2" type="button" ${sel.total === 0 || over || drawState.t2Status === 'loading' ? 'disabled' : ''} onclick="exportCsv(false)">Download</button>
    </div>
    <div class="ex-note">${escapeHtml(EXPORT_NOTICE)}</div>`;
}
function toggleExportSector(k, on) { on ? drawState.coreOff.delete(k) : drawState.coreOff.add(k); renderExportSheet(); }
function toggleExportT2(on) { drawState.t2Off = !on; renderExportSheet(); }
function _exportKey(e) { if (e.key === 'Escape') closeExportSheet(); }
function openExportSheet() {
  const sheet = document.getElementById('export-sheet'); if (!sheet || !drawState.ring) return;
  renderExportSheet();
  sheet.removeAttribute('hidden');
  requestAnimationFrame(() => sheet.classList.add('open'));
  document.addEventListener('keydown', _exportKey);
}
function closeExportSheet(silent) {
  const sheet = document.getElementById('export-sheet'); if (!sheet) return;
  sheet.classList.remove('open');
  document.removeEventListener('keydown', _exportKey);
  setTimeout(() => { if (!sheet.classList.contains('open')) sheet.setAttribute('hidden', ''); }, 360);
}

// ── CSV
function csvCell(v, isText = true) {
  if (v == null || v === '') return '';
  let s = String(v);
  if (isText && /^[=+\-@\t\r]/.test(s)) s = "'" + s;           // stop spreadsheet formula injection
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
const _pv = (p, name) => { if (!p) return ''; if (p[name] != null) return p[name]; const k = Object.keys(p).find(x => x.toLowerCase() === name.toLowerCase()); return k ? p[k] : ''; };
const EXPORT_COLS = [
  ['dataset',            r => r.t2 ? 'Tier II' : 'Critical2TN'],
  ['name',               r => r.t2 ? _pv(r.p, 'FacilityName') : r.a.name],
  ['cisa_sector',        r => r.t2 ? '' : sectorOf(r.a).label],
  ['sector_as_entered',  r => r.t2 ? '' : r.a.sector],
  ['lifeline',           r => r.t2 ? '' : r.a.lifelineRaw],
  ['asset_type',         r => r.t2 ? '' : r.a.assetType],
  ['component',          r => r.t2 ? '' : r.a.component],
  ['subcomponent',       r => r.t2 ? '' : r.a.subcomp],
  ['address',            r => r.t2 ? _pv(r.p, 'Street') : r.a.address],
  ['city',               r => r.t2 ? _pv(r.p, 'City') : r.a.city],
  ['state',              r => r.t2 ? _pv(r.p, 'State') : r.a.state],
  ['zip',                r => r.t2 ? _pv(r.p, 'Zip') : r.a.zip],
  ['county',             r => r.t2 ? _pv(r.p, 'County') : r.a.county],
  ['region',             r => r.t2 ? '' : r.a.region],
  ['latitude',           r => r.t2 ? (r.f.geometry ? r.f.geometry.y : _pv(r.p, 'Latitude')) : r.a.lat, false],
  ['longitude',          r => r.t2 ? (r.f.geometry ? r.f.geometry.x : _pv(r.p, 'Longitude')) : r.a.lng, false],
  ['hsip_id',            r => r.t2 ? '' : r.a.hsipId],
  ['contact_name',       r => r.t2 ? '' : r.a.contactName],
  ['contact_agency',     r => r.t2 ? '' : r.a.contactAgency],
  ['contact_phone',      r => r.t2 ? '' : r.a.contactPhone],
  ['contact_email',      r => r.t2 ? '' : r.a.contactEmail],
  ['t2_company',         r => r.t2 ? _pv(r.p, 'Company_Name') : ''],
  ['t2_facility_id',     r => r.t2 ? (_pv(r.p, 'FacilityId') || _pv(r.p, 'State_Facility_ID')) : ''],
  ['t2_chemical',        r => r.t2 ? _pv(r.p, 'ChemicalName') : ''],
  ['t2_cas_number',      r => r.t2 ? _pv(r.p, 'CASNumber') : ''],
  ['t2_max_daily_qty',   r => r.t2 ? _pv(r.p, 'MaxDailyQty') : ''],
  ['t2_avg_daily_qty',   r => r.t2 ? _pv(r.p, 'AvgDailyQty') : ''],
  ['t2_max_container',   r => r.t2 ? _pv(r.p, 'MaxAmountInLargestContainer') : ''],
  ['t2_ehs',             r => r.t2 ? _pv(r.p, 'EHS') : ''],
  ['t2_filing_year',     r => r.t2 ? _pv(r.p, 'Filing_Year') : ''],
  ['t2_filing_type',     r => r.t2 ? _pv(r.p, 'Filing_Type') : ''],
  ['t2_contact_info',    r => r.t2 ? _pv(r.p, 'ContactInfo') : ''],
];
function buildCsv() {
  const sel = exportSelection(), now = new Date().toISOString(), who = (TOKEN && TOKEN.username) || '';
  const rows = [...sel.core.map(a => ({ a })), ...sel.t2.map(f => ({ t2: true, f, p: f.attributes || {} }))];
  const head = EXPORT_COLS.map(c => c[0]).concat(['exported_by', 'exported_utc', 'handling_notice']).join(',');
  const lines = rows.map(r => EXPORT_COLS.map(c => csvCell(c[1](r), c[2] !== false)).concat([csvCell(who), csvCell(now), csvCell(EXPORT_NOTICE)]).join(','));
  return '﻿' + [head, ...lines].join('\r\n') + '\r\n';
}
async function exportCsv(preferShare) {
  const sel = exportSelection();
  if (!sel.total || sel.total > EXPORT_CAP) return;
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const name = `Critical2TN_export_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.csv`;
  const blob = new Blob([buildCsv()], { type: 'text/csv;charset=utf-8' });
  if (preferShare && navigator.canShare && navigator.share) {
    const file = new File([blob], name, { type: 'text/csv' });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Critical2TN export', text: EXPORT_NOTICE }); return; }
      catch (err) { if (err && err.name === 'AbortError') return; /* otherwise fall back to download */ }
    }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

async function startApp() {
  buildFilterGrid();
  bindListHandlers();
  initMap();
  initDraw();                 // draw an area -> export CSV
  initRefLayers();            // reference layers (off by default; see REFERENCE LAYERS)
  await fetchAssets();
  // Discover layer capabilities (hasAttachments, etc.) — runs in parallel
  // with everything else; the result is consulted when a detail is opened.
  fetchLayerMeta();
  if (navigator.geolocation) navigator.geolocation.getCurrentPosition(onLocationSuccess, () => {}, { timeout: 5000 });
  if (CONFIG.refreshInterval > 0) {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(fetchAssets, CONFIG.refreshInterval);
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  // Step 1 — if we just got back from the OAuth redirect, exchange the code
  const consumed = await handleOAuthCallback();
  if (consumed) {
    hideLogin();
    startApp();
    return;
  }
  // Step 2 — otherwise, look for a cached token from a previous session
  const stored = loadStoredToken();
  if (stored && stored.accessToken) {
    TOKEN = stored;
    // If the access token is past expiry, try a silent refresh first
    try {
      if (Date.now() > stored.expiresAt - CONFIG.refreshBufferMs) {
        await ensureFreshToken();
      }
      hideLogin();
      startApp();
    } catch (err) {
      console.warn('Silent refresh on startup failed:', err);
      clearStoredToken();
      showLogin();
    }
  } else {
    showLogin();
  }
});

window.addEventListener('load', () => { setTimeout(() => { if (map) map.invalidateSize(); }, 300); });
window.addEventListener('resize', () => { if (map) map.invalidateSize(); });
</script>
