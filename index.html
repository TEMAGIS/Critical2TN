<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#002868">
<meta name="referrer" content="no-referrer-when-downgrade">
<!-- Allow Experience Builder (and other parents) to embed this app in
     an iframe. Browsers ignore CSP in <meta>, but it documents intent
     and matches the pattern used in the shelter app. -->
<meta http-equiv="Content-Security-Policy" content="frame-ancestors *">
<script>
  // Apply embed layout immediately to avoid a flash of the wrong sizing.
  // Usage: append ?layout=full to the URL in the Experience Builder
  // embed widget so the app stretches to fill the iframe.
  (function() {
    const p = new URLSearchParams(window.location.search);
    if (p.get('layout') === 'full') document.documentElement.classList.add('layout-full');
  })();
</script>
<title>Critical2TN</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f0f2f5; --surface: #ffffff; --surface2: #f7f8fa; --border: #e2e5ea;
    --text: #0f1117; --text2: #444c5c; --text3: #4f5665;
    --tema-blue: #002868; --tema-red: #BF0A30;
    --focus: #ffbf47;
    --shadow: 0 2px 12px rgba(0,0,0,0.08); --shadow-lg: 0 8px 32px rgba(0,0,0,0.14);
    --radius: 14px; --radius-sm: 8px;
  }
  html, body { height: 100%; margin: 0; padding: 0; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  #app { display: flex; flex-direction: column; height: 100%; min-height: 100vh; max-width: 480px; margin: 0 auto; background: var(--bg); }
  /* App is hidden until the user is signed in */
  #app[hidden] { display: none !important; }
  /* ?layout=full — embed mode: stretch to fill the iframe container */
  .layout-full #app { max-width: 100%; margin: 0; }

  /* ── Login screen ────────────────────────────────────────── */
  #login-screen {
    position: fixed; inset: 0; z-index: 5000;
    background: linear-gradient(165deg, var(--tema-blue) 0%, #00193f 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }
  #login-screen[hidden] { display: none; }
  .login-card {
    width: 100%; max-width: 420px;
    background: var(--surface); border-radius: 18px;
    padding: 28px 24px 22px; box-shadow: var(--shadow-lg);
  }
  .login-brand { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 18px; }
  .login-brand .tn-badge { width: 56px; height: 56px; }
  .login-title { font-size: 18px; font-weight: 700; color: var(--text); text-align: center; letter-spacing: -0.3px; }
  .login-sub   { font-size: 13px; color: var(--text2); text-align: center; line-height: 1.4; max-width: 340px; }
  .login-form  { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
  .login-form label { font-size: 12px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
  .login-form input {
    width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif; font-size: 16px; background: var(--surface2); color: var(--text);
    outline: none; transition: border-color 0.15s, background 0.15s;
  }
  .login-form input:focus { border-color: var(--tema-blue); background: var(--surface); box-shadow: 0 0 0 3px rgba(0,40,104,0.12); }
  .login-row { display: flex; flex-direction: column; gap: 6px; }
  .login-checkbox { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2); }
  .login-checkbox input { width: auto; }
  .login-btn {
    width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm);
    background: var(--tema-blue); color: white; font-size: 15px; font-weight: 700;
    font-family: 'DM Sans', sans-serif; cursor: pointer; min-height: 48px;
    transition: opacity 0.15s, transform 0.05s;
  }
  .login-btn:hover { opacity: 0.92; }
  .login-btn:active { transform: scale(0.99); }
  .login-btn:disabled { opacity: 0.55; cursor: wait; }
  .login-btn-oauth { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 6px; }
  .login-btn-oauth:hover { background: #003a8c; }
  .login-error {
    background: #fde8ea; border: 1px solid #f5c2c7; color: #842029;
    padding: 10px 12px; border-radius: var(--radius-sm); font-size: 13px;
    line-height: 1.4; display: none;
  }
  .login-error.visible { display: block; }
  .login-meta { font-size: 11px; color: var(--text3); text-align: center; margin-top: 14px; line-height: 1.5; }
  .login-meta a { color: var(--tema-blue); text-decoration: none; }
  .login-meta a:hover { text-decoration: underline; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .skip-link { position: absolute; top: -100px; left: 0; z-index: 9999; background: var(--focus); color: #000; font-weight: 700; font-size: 14px; padding: 10px 16px; border-radius: 0 0 8px 0; text-decoration: none; transition: top 0.2s; }
  .skip-link:focus { top: 0; }

  /* ── Header ──────────────────────────────────────────────── */
  #header { background: var(--tema-blue); padding: 12px 16px 10px; flex-shrink: 0; z-index: 100; padding-top: max(12px, env(safe-area-inset-top)); }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
  .app-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .tn-badge { width: 38px; height: 38px; display: block; flex-shrink: 0; }
  .app-title-text { color: white; font-size: 16px; font-weight: 700; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-pills { display: flex; gap: 6px; flex-shrink: 0; }
  .header-pill {
    display: flex; align-items: center; gap: 5px; font-size: 12px; font-family: 'DM Mono', monospace;
    color: white; background: rgba(255,255,255,0.18); border: 1.5px solid rgba(255,255,255,0.5);
    border-radius: 20px; padding: 6px 11px; cursor: pointer; transition: background 0.15s; white-space: nowrap;
    font-weight: 600; min-height: 36px;
  }
  .header-pill:hover { background: rgba(255,255,255,0.28); }
  .header-pill.icon-only { padding: 6px; aspect-ratio: 1; justify-content: center; }
  .search-wrap { position: relative; margin-bottom: 8px; }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; }
  #search-input {
    width: 100%; padding: 10px 10px 10px 34px; border: 2px solid var(--border); border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif; font-size: 16px;
    background: var(--surface); color: var(--text); outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #search-input:focus { border-color: var(--focus); box-shadow: 0 0 0 3px rgba(255,191,71,0.35); }

  .filter-btn {
    display: flex; align-items: center; gap: 5px;
    background: var(--surface); border: 1.5px solid var(--border);
    color: var(--text2); border-radius: 20px; padding: 5px 11px;
    font-size: 12px; font-weight: 700; font-family: 'DM Sans', sans-serif;
    cursor: pointer; transition: all 0.15s; white-space: nowrap; min-height: 32px;
  }
  .filter-btn:hover { border-color: var(--tema-blue); color: var(--tema-blue); }
  .filter-btn.has-filter { background: var(--tema-blue); border-color: var(--tema-blue); color: white; }
  .active-filters { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; padding: 0 16px 8px; }
  .active-filters:empty { display: none; }
  .active-chip {
    display: flex; align-items: center; gap: 3px;
    background: var(--tema-blue); color: white;
    border-radius: 12px; padding: 3px 8px; border: none;
    font-size: 11px; font-weight: 700; white-space: nowrap; cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }
  .active-chip-x { font-size: 13px; line-height: 1; opacity: 0.8; margin-left: 1px; }
  #filter-drawer {
    overflow: hidden; max-height: 0;
    transition: max-height 0.3s cubic-bezier(0.4,0,0.2,1);
    background: var(--tema-blue);
    padding: 0 16px;
  }
  #filter-drawer.open { max-height: min(62vh, 400px); overflow-y: auto; padding: 12px 16px 14px; }
  .fg-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
  @media (min-width: 480px) { .fg-row { grid-template-columns: repeat(8, 1fr); } }
  .fgt {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; user-select: none; opacity: 0.65; transition: opacity 0.15s, transform 0.15s;
    background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.15);
    padding: 7px 4px; border-radius: 10px; color: white;
    font-family: 'DM Sans', sans-serif;
  }
  .fgt:hover { opacity: 0.95; background: rgba(255,255,255,0.12); }
  .fgt.active { opacity: 1; background: white; border-color: white; color: var(--tema-blue); transform: scale(1.02); }
  .fgt-icon { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
  .fgt-icon svg { width: 100%; height: 100%; }
  .fgt-label { font-size: 10px; font-weight: 700; text-align: center; line-height: 1.15; }


  /* ── CISA sector icons (class-based; images live in #sector-icon-css) ── */
  .sico { display: block; flex-shrink: 0; border-radius: 50%; background: center / contain no-repeat; }
  .sico-unknown { background: #8a8f98; }
  .type-icon { background: none; border-radius: 50%; width: 38px; height: 38px; }
  .fgt-count { font-size: 9px; font-weight: 600; opacity: 0.8; line-height: 1; min-height: 9px; font-family: 'DM Mono', monospace; }
  .fgt.empty:not(.active) { opacity: 0.35; }
  .fgt:not(.active):not(.empty) { opacity: 0.92; }
  /* "All" sits on its own slim full-width row so the 16 sectors form an even grid */
  .fgt[data-key="all"] { grid-column: 1 / -1; flex-direction: row; justify-content: center; gap: 10px; padding: 6px 4px; }
  .fgt[data-key="all"] .fgt-icon { width: 22px; height: 22px; }
  .fgt[data-key="all"] .fgt-count { font-size: 11px; opacity: 1; }
  .meta-badge.lifeline { background: #f0e9f7; border-color: #c9b8df; color: #5a3a85; }


  /* ── Reference layers: map button, popup bits, bottom sheet ───── */
  #layers-toggle {
    position: absolute; top: 56px; left: 12px; z-index: 1000;
    background: white; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 11px;
    display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; font-family: 'DM Sans', sans-serif;
    cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.18); min-height: 36px;
  }
  #layers-toggle:hover { background: var(--tema-blue); color: white; border-color: var(--tema-blue); }
  #layers-toggle:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  #layers-count { background: var(--tema-red); color: #fff; border-radius: 9px; font-size: 10px; min-width: 18px; height: 18px; line-height: 18px; text-align: center; padding: 0 4px; font-family: 'DM Mono', monospace; }
  #layers-count[hidden] { display: none; }
  .ref-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
  .ref-row { display: flex; gap: 10px; justify-content: space-between; font-size: 12px; margin-top: 3px; }
  .ref-row > span:first-child { color: var(--text3); font-weight: 600; flex-shrink: 0; }
  .ref-row > span:last-child { text-align: right; word-break: break-word; }
  .ref-list { font-size: 12px; margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--border); line-height: 1.45; }
  #layers-sheet { position: fixed; inset: 0; z-index: 2000; pointer-events: none; }
  #layers-sheet[hidden] { display: none; }
  #layers-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.45); opacity: 0; transition: opacity 0.3s; }
  #layers-content {
    position: absolute; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: var(--surface);
    border-radius: 20px 20px 0 0; padding: 0 0 max(16px, env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.32,0.72,0,1); max-height: 82vh; overflow-y: auto; overscroll-behavior: contain;
  }
  #layers-sheet.open { pointer-events: all; }
  #layers-sheet.open #layers-overlay { opacity: 1; }
  #layers-sheet.open #layers-content { transform: translateY(0); }
  #layers-body { padding: 8px 16px 6px; }
  .rl-title { font-size: 19px; font-weight: 700; letter-spacing: -0.4px; margin: 10px 40px 2px 4px; }
  .rl-sub { font-size: 12px; color: var(--text3); margin: 0 4px 10px; line-height: 1.4; }
  .rl-county { display: flex; gap: 10px; align-items: flex-start; background: #eef3fb; border: 1px solid #c9d6ee; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; font-weight: 600; }
  .rl-county small, .rl-bname small, .rl-name small { display: block; font-size: 11px; font-weight: 500; color: var(--text3); margin-top: 1px; }
  .rl-county input, .rl-row input { width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--tema-blue); margin: 0; }
  .rl-bundle { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; background: var(--surface); }
  .rl-bundle summary { display: flex; align-items: center; gap: 8px; padding: 12px 14px; cursor: pointer; font-weight: 700; font-size: 14px; list-style: none; min-height: 44px; }
  .rl-bundle summary::-webkit-details-marker { display: none; }
  .rl-bundle summary::after { content: '›'; font-size: 20px; color: var(--text3); transform: rotate(90deg); transition: transform .2s; margin-left: 4px; }
  .rl-bundle[open] summary::after { transform: rotate(-90deg); }
  .rl-bname { flex: 1; min-width: 0; }
  .rl-bon { font-size: 11px; font-weight: 700; color: #fff; background: var(--tema-blue); border-radius: 9px; padding: 1px 8px; font-family: 'DM Mono', monospace; }
  .rl-bon:empty { display: none; }
  .rl-row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--border); font-size: 13px; font-weight: 600; cursor: pointer; min-height: 44px; }
  .rl-row.dis { opacity: .55; }
  .rl-name { flex: 1; min-width: 0; }
  .rl-name small[data-s="error"], .rl-name small[data-s="unavailable"] { color: #b3261e; }
  .rl-name small[data-s="zoom"] { color: #8a5a00; }
  .rl-sw { width: 14px; height: 14px; flex-shrink: 0; background: var(--c); border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); border-radius: 50%; }
  .rl-sw.line { height: 4px; width: 14px; border-radius: 2px; border: 0; box-shadow: none; }
  .rl-sw.poly { border-radius: 3px; background: color-mix(in srgb, var(--c) 25%, white); border: 2px solid var(--c); box-shadow: none; }
  .rl-sw.img { border-radius: 3px; background: linear-gradient(135deg, var(--c), transparent); border: 1px solid var(--c); box-shadow: none; }
  .rl-clear { width: 100%; margin: 6px 0 4px; padding: 12px; border: 1.5px solid var(--border); background: var(--surface2); border-radius: 10px; font-weight: 700; font-size: 13px; color: var(--text2); cursor: pointer; font-family: inherit; }


  /* ── Draw an area / export ───────────────────────────────────── */
  #draw-toggle {
    position: absolute; top: 100px; left: 12px; z-index: 1000;
    background: white; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 11px;
    display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; font-family: 'DM Sans', sans-serif;
    cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.18); min-height: 36px;
  }
  #draw-toggle:hover, #draw-toggle.on { background: var(--tema-red); color: white; border-color: var(--tema-red); }
  #draw-toggle:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  /* Layers + Draw sit in a column under the zoom control (top-right), icon-only */
  #layers-toggle, #draw-toggle { left: auto; right: 10px; width: 34px; height: 34px; min-height: 34px; padding: 0; justify-content: center; border-radius: 4px; border: 2px solid rgba(0,0,0,0.2); box-shadow: none; background-clip: padding-box; }
  #layers-toggle { top: 88px; }
  #draw-toggle { top: 128px; }
  #layers-toggle > span:not(#layers-count), #draw-toggle > span { display: none; }
  #layers-toggle svg, #draw-toggle svg { width: 18px; height: 18px; }
  #layers-count { position: absolute; top: -8px; left: -8px; }
  #draw-bar { position: absolute; left: 12px; right: 72px; bottom: 12px; z-index: 1000; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    background: rgba(255,255,255,0.96); border: 1px solid var(--border); border-radius: 12px; padding: 7px 8px; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
  #draw-bar[hidden] { display: none; }
  .dmsg { font-size: 12px; font-weight: 700; color: var(--text); flex: 1 1 100%; }
  .db { font-family: inherit; font-size: 12px; font-weight: 700; padding: 8px 12px; min-height: 36px; border-radius: 8px; border: 1.5px solid var(--tema-blue); background: #fff; color: var(--tema-blue); cursor: pointer; }
  .db.pri { background: var(--tema-blue); color: #fff; }
  .db.ghost { border-color: var(--border); color: var(--text2); }
  #map.drawing, #map.drawing .leaflet-grab { cursor: crosshair; }
  #map.drawing .leaflet-marker-icon, #map.drawing .leaflet-interactive { pointer-events: none !important; }
  #export-sheet { position: fixed; inset: 0; z-index: 2000; pointer-events: none; }
  #export-sheet[hidden] { display: none; }
  #export-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.45); opacity: 0; transition: opacity 0.3s; }
  #export-content { position: absolute; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: var(--surface);
    border-radius: 20px 20px 0 0; padding: 0 0 max(16px, env(safe-area-inset-bottom)); transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.32,0.72,0,1); max-height: 82vh; overflow-y: auto; overscroll-behavior: contain; }
  #export-sheet.open { pointer-events: all; }
  #export-sheet.open #export-overlay { opacity: 1; }
  #export-sheet.open #export-content { transform: translateY(0); }
  #export-body { padding: 8px 16px 6px; }
  .ex-card { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; padding: 4px 0; }
  .ex-card.dis { opacity: .6; }
  .ex-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; font-weight: 700; font-size: 14px; gap: 8px; }
  .ex-head input { width: 20px; height: 20px; accent-color: var(--tema-blue); vertical-align: -4px; margin-right: 4px; }
  .ex-sec { display: flex; align-items: center; gap: 10px; padding: 7px 14px; border-top: 1px solid var(--border); font-size: 13px; font-weight: 600; min-height: 40px; cursor: pointer; }
  .ex-sec span { flex: 1; }
  .ex-sec b { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text2); }
  .ex-sec input { width: 20px; height: 20px; accent-color: var(--tema-blue); margin: 0; }
  .ex-none { padding: 6px 14px 8px; font-size: 12px; color: var(--text3); }
  .ex-none[data-s="error"], .ex-none[data-s="unavailable"] { color: #b3261e; }
  .ex-link { background: none; border: 0; color: var(--tema-blue); font-weight: 700; text-decoration: underline; cursor: pointer; font-family: inherit; font-size: 12px; }
  .ex-total { font-size: 13px; font-weight: 700; margin: 10px 4px 8px; }
  .ex-total.over { color: #b3261e; }
  .ex-btns { display: flex; gap: 8px; }
  .ex-btns button { font-family: inherit; font-weight: 700; font-size: 14px; border-radius: 10px; padding: 13px; min-height: 48px; cursor: pointer; }
  .ex-pri { flex: 2; background: var(--tema-blue); color: #fff; border: 0; }
  .ex-sec2 { flex: 1; background: var(--surface2); color: var(--text); border: 1.5px solid var(--border); }
  .ex-btns button:disabled { opacity: .4; cursor: not-allowed; }
  .ex-note { font-size: 11px; color: var(--text3); margin: 10px 4px 2px; line-height: 1.4; }

  /* ── Map ─────────────────────────────────────────────────── */
  #map-container { flex-shrink: 0; height: 36vh; position: relative; }
  #map { width: 100%; height: 100%; }
  #fab-locate {
    position: absolute; bottom: 14px; right: 12px; width: 48px; height: 48px;
    background: var(--tema-blue); color: white; border: none; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(0,40,104,0.4);
    transition: transform 0.15s; z-index: 1000;
  }
  #basemap-toggle {
    position: absolute; top: 12px; left: 12px; z-index: 1000;
    background: white; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 11px;
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; font-family: 'DM Sans', sans-serif;
    cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    min-height: 36px; transition: background 0.15s, color 0.15s;
  }
  #basemap-toggle:hover { background: var(--tema-blue); color: white; border-color: var(--tema-blue); }
  #basemap-toggle:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  #fab-locate:hover { transform: scale(1.08); }
  #fab-locate:active { transform: scale(0.95); }

  /* ── List ────────────────────────────────────────────────── */
  #list-section { flex: 1; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .list-controls { position: sticky; top: 0; z-index: 10; background: var(--bg); box-shadow: 0 1px 0 rgba(0,0,0,0.04); }
  .list-header { padding: 10px 16px 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .list-count { font-size: 12px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: 0.6px; }
  #last-refreshed { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; margin-top: 2px; }
  .stale-badge { display: inline-block; background: #fdeed3; color: #6b4200; border: 1px solid #d4920a; padding: 1px 6px; border-radius: 6px; font-size: 10px; font-weight: 700; margin-left: 4px; vertical-align: 2px; }
  .sort-toggle {
    font-size: 12px; color: var(--tema-blue); font-weight: 700; cursor: pointer;
    padding: 6px 10px; border-radius: 6px; border: none; background: none;
    min-height: 36px; display: flex; align-items: center;
  }
  #asset-list { display: flex; flex-direction: column; padding: 0 0 80px; }

  /* ── Card ────────────────────────────────────────────────── */
  .asset-card {
    background: var(--surface); margin: 0 12px 8px; border-radius: var(--radius);
    box-shadow: var(--shadow); border: 2px solid transparent; cursor: pointer; transition: all 0.2s; overflow: hidden;
  }
  .asset-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
  .asset-card:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-color: transparent; }
  .asset-card.selected { border-color: var(--tema-blue); box-shadow: 0 0 0 3px rgba(0,40,104,0.1), var(--shadow); }
  .card-body { display: flex; align-items: stretch; }
  .card-strip { width: 5px; flex-shrink: 0; }
  .card-content { flex: 1; padding: 13px 13px 10px; min-width: 0; }
  .card-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 5px; }
  .type-icon { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: white; }
  .type-icon svg { width: 22px; height: 22px; }
  .card-titles { flex: 1; min-width: 0; }
  .card-name-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-name { font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.2px; flex: 1; min-width: 0; }
  .card-type-label { font-size: 12px; font-weight: 600; margin-top: 1px; }
  .card-asset-type { font-size: 11px; color: var(--text3); margin-top: 1px; font-style: italic; }
  .card-address { font-size: 12px; color: var(--text2); line-height: 1.4; margin-bottom: 0; }
  .dist-pill { font-size: 11px; font-family: 'DM Mono', monospace; font-weight: 600; color: #003a8c; background: #dce6fb; padding: 3px 8px; border-radius: 6px; flex-shrink: 0; white-space: nowrap; }
  .meta-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .meta-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; white-space: nowrap; background: var(--surface2); border: 1px solid var(--border); color: var(--text2); }
  .meta-badge.region { background: #e8eef9; border-color: #b9c8e6; color: #1e3a6e; }
  .meta-badge.sector { background: #f0e9f7; border-color: #c9b8df; color: #5a3a85; }
  .card-footer { border-top: 1px solid var(--border); display: flex; }
  .card-action {
    flex: 1; padding: 12px 6px; display: flex; align-items: center; justify-content: center; gap: 4px;
    font-size: 12px; font-weight: 700; color: var(--text2); cursor: pointer; transition: background 0.15s, color 0.15s;
    text-decoration: none; border: none; background: none; font-family: 'DM Sans', sans-serif;
    min-height: 44px;
  }
  .card-action:hover { background: var(--surface2); color: var(--tema-blue); }
  .card-action + .card-action { border-left: 1px solid var(--border); }
  .card-action.primary { color: var(--tema-blue); }

  /* ── Empty / status ──────────────────────────────────────── */
  .empty-state { text-align: center; padding: 48px 24px; color: var(--text3); }
  .empty-state .icon { font-size: 36px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.5; }
  .offline-banner { background: #fdeed3; border-bottom: 1px solid #d4920a; color: #6b4200; padding: 8px 14px; font-size: 12px; text-align: center; font-weight: 600; }

  /* ── User marker ─────────────────────────────────────────── */
  .user-dot { width: 16px; height: 16px; background: var(--tema-blue); border-radius: 50%; border: 3px solid white; box-shadow: 0 0 0 3px rgba(0,40,104,0.3); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 3px rgba(0,40,104,0.3)} 50%{box-shadow:0 0 0 8px rgba(0,40,104,0.08)} }
  .leaflet-popup-content-wrapper { border-radius: var(--radius-sm) !important; box-shadow: var(--shadow-lg) !important; font-family: 'DM Sans',sans-serif !important; padding: 0 !important; }
  .leaflet-popup-content { margin: 0 !important; }
  .pop { padding: 11px 13px; min-width: 160px; }
  .pop-name { font-size: 13px; font-weight: 700; margin-bottom: 2px; color: var(--text); }
  .pop-type { font-size: 11px; font-weight: 600; }

  /* ── Detail Sheet ────────────────────────────────────────── */
  #detail-sheet { position: fixed; inset: 0; z-index: 2000; pointer-events: none; }
  #detail-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.55); opacity: 0; transition: opacity 0.3s; }
  #detail-content {
    position: absolute; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto;
    background: var(--surface); border-radius: 20px 20px 0 0;
    padding: 0 0 env(safe-area-inset-bottom,20px);
    transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
    max-height: 85vh; overflow-y: auto;
  }
  #detail-sheet.open { pointer-events: all; }
  #detail-sheet.open #detail-overlay { opacity: 1; }
  #detail-sheet.open #detail-content { transform: translateY(0); }
  .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; }
  .sheet-close-btn {
    position: absolute; top: 12px; right: 16px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 50%; width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px; line-height: 1; color: var(--text2);
  }
  .sheet-banner { margin: 14px 20px 0; border-radius: var(--radius-sm); padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px; color: white; }
  .sheet-banner svg { width: 24px; height: 24px; flex-shrink: 0; }
  .banner-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .banner-desc { font-size: 12px; margin-top: 2px; opacity: 0.95; line-height: 1.4; }
  .sheet-header { padding: 14px 20px 10px; }
  .sheet-name { font-size: 19px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 3px; }
  .sheet-addr { font-size: 13px; color: var(--text2); line-height: 1.4; }
  .sheet-dist { font-size: 12px; font-family: 'DM Mono',monospace; font-weight: 700; margin-top: 5px; color: #003a8c; }
  .sdiv { height: 1px; background: var(--border); margin: 0 20px; }
  .sec { padding: 14px 20px; }
  .sec-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text3); margin-bottom: 8px; }
  .kv-grid { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; font-size: 13px; }
  .kv-key { color: var(--text3); font-weight: 600; }
  .kv-val { color: var(--text); word-break: break-word; }
  .kv-empty { color: var(--text3); font-style: italic; opacity: 0.75; }
  a.kv-link { color: var(--tema-blue); text-decoration: none; font-weight: 600; }
  a.kv-link:hover { text-decoration: underline; }
  .attachment-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 4px; }
  .attachment-tile {
    aspect-ratio: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    overflow: hidden; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center;
    color: var(--text3); font-size: 11px;
  }
  .attachment-tile img { width: 100%; height: 100%; object-fit: cover; }
  .attachment-tile .fileinfo { padding: 6px; text-align: center; line-height: 1.3; }
  .attachment-tile.loading { background: linear-gradient(90deg, var(--surface2) 25%, #ececec 50%, var(--surface2) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  .nav-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px 20px; }
  .nav-btn { padding: 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; font-family: 'DM Sans',sans-serif; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; transition: opacity 0.15s; min-height: 48px; }
  .nav-btn:hover { opacity: 0.88; }
  .nav-btn.goo { background: #1558d6; color: white; }
  .nav-btn.apl { background: #111; color: white; }

  /* ── Image lightbox ──────────────────────────────────────── */
  #lightbox {
    position: fixed; inset: 0; z-index: 5500; background: rgba(0,0,0,0.92);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  #lightbox[hidden] { display: none; }
  #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
  #lightbox .close {
    position: absolute; top: max(16px, env(safe-area-inset-top)); right: 16px;
    background: rgba(0,0,0,0.6); border: 1.5px solid white; color: white;
    border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
  }

  @keyframes loadbar { 0%{transform:translateX(-100%)} 100%{transform:translateX(350%)} }
  @media(min-width:600px){ #app{ box-shadow: var(--shadow-lg); } }

  /* ── Desktop layout ──────────────────────────────────────── */
  @media (min-width: 900px) {
    #app {
      display: grid;
      grid-template-rows: auto 1fr;
      grid-template-columns: 420px 1fr;
      max-width: none; width: 100%; height: 100vh; min-height: 100vh; box-shadow: none;
    }
    #header        { grid-column: 1 / -1; grid-row: 1; }
    #list-section  { grid-column: 1; grid-row: 2; border-right: 1px solid var(--border); }
    #map-container { grid-column: 2; grid-row: 2; height: 100%; }
    #detail-content { left: 0; right: auto; bottom: 0; width: 420px; max-width: 420px; margin: 0; max-height: calc(100vh - 60px); }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
</style>
</head>
<body>
<a class="skip-link" href="#asset-list">Skip to asset list</a>

<!-- ════════════════════════════════════════════════════════════
     LOGIN SCREEN
     Shown until a valid AGOL token is obtained. The Sign in
     button kicks off the OAuth 2.0 authorization-code (PKCE) flow.
     ════════════════════════════════════════════════════════════ -->
<div id="login-screen" role="dialog" aria-labelledby="login-title">
  <div class="login-card">
    <div class="login-brand">
      <svg class="tn-badge" viewBox="0 0 100 100" role="img" aria-label="Tennessee state logo">
        <rect x="0" y="0" width="100" height="84" fill="#D22730"/>
        <rect x="0" y="84" width="100" height="5" fill="#ffffff"/>
        <rect x="0" y="89" width="100" height="11" fill="#002868"/>
        <text x="50" y="70" text-anchor="middle" textLength="86" lengthAdjust="spacingAndGlyphs"
              font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="74"
              fill="#ffffff">TN</text>
      </svg>
      <div>
        <div class="login-title" id="login-title">Critical2TN</div>
        <div class="login-sub">Sign in with your ArcGIS Online account to view critical infrastructure assets near your location.</div>
      </div>
    </div>
    <div id="login-error" class="login-error" role="alert"></div>
    <button id="oauth-signin-btn" class="login-btn login-btn-oauth" type="button" onclick="startOAuthFlow()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" style="flex-shrink:0">
        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="8.5" cy="7" r="4"/>
        <polyline points="17 11 19 13 23 9"/>
      </svg>
      Sign in with ArcGIS Online
    </button>
    <a id="oauth-fallback" href="#" target="_blank" hidden
       style="display:block;text-align:center;font-size:12px;color:var(--text3);margin-top:10px;text-decoration:underline;cursor:pointer">
      Sign-in didn't open? Open in a new tab
    </a>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════
     MAIN APP — hidden until login completes
     ════════════════════════════════════════════════════════════ -->
<div id="app" role="application" aria-label="Critical2TN map" hidden>
  <header id="header" role="banner">
    <div class="header-top">
      <div class="app-title">
        <svg class="tn-badge" viewBox="0 0 100 100" role="img" aria-label="Tennessee state logo">
          <rect x="0" y="0" width="100" height="84" fill="#D22730"/>
          <rect x="0" y="84" width="100" height="5" fill="#ffffff"/>
          <rect x="0" y="89" width="100" height="11" fill="#002868"/>
          <text x="50" y="70" text-anchor="middle" textLength="86" lengthAdjust="spacingAndGlyphs"
                font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="74"
                fill="#ffffff">TN</text>
        </svg>
        <h1 class="app-title-text">Critical2TN</h1>
      </div>
      <div class="header-pills">
        <button class="header-pill" onclick="requestLocation()" aria-label="Use my location">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          <span id="loc-label">Locate</span>
        </button>
      </div>
    </div>
    <div class="search-wrap">
      <label for="search-input" class="sr-only">Search assets</label>
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search-input" type="search" placeholder="Search by name, city, county, sector…" oninput="onSearch()" aria-label="Search assets" autocomplete="off">
    </div>
    <div id="loading-bar" role="progressbar" aria-label="Loading" style="display:none;height:3px;background:rgba(255,255,255,0.3);border-radius:2px;overflow:hidden;margin-bottom:2px">
      <div style="height:100%;width:40%;background:white;border-radius:2px;animation:loadbar 1.2s ease-in-out infinite"></div>
    </div>
  </header>

  <div id="offline-banner" class="offline-banner" hidden>
    Showing cached data — connection unavailable. <button onclick="fetchAssets()" style="background:none;border:none;color:#6b4200;font-weight:700;text-decoration:underline;cursor:pointer;font-family:inherit;font-size:inherit">Retry</button>
  </div>

  <div id="map-container" role="region" aria-label="Map showing infrastructure asset locations">
    <div id="map"></div>
    <button id="basemap-toggle" type="button" onclick="toggleBasemap()" aria-label="Switch to Hybrid basemap" title="Switch basemap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><polygon points="12 2 22 8.5 12 15 2 8.5 12 2"/><polyline points="2 15.5 12 22 22 15.5"/></svg>
      <span class="basemap-label">Hybrid</span>
    </button>
    <button id="layers-toggle" type="button" onclick="openLayersSheet()" aria-haspopup="dialog" aria-label="Open map layers" title="Map layers">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/><path d="m2 17.5 10 5 10-5" opacity=".5"/></svg>
      <span>Layers</span><span id="layers-count" hidden>0</span>
    </button>
    <button id="draw-toggle" type="button" onclick="toggleDraw()" aria-label="Draw an area to export" title="Draw an area to export">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><polygon points="12 3 21 9 18 20 6 20 3 9" stroke-dasharray="3 2.5"/></svg>
      <span>Draw</span>
    </button>
    <div id="draw-bar" role="toolbar" aria-label="Draw tools" hidden></div>
    <button id="fab-locate" onclick="recenterOnUser()" title="Re-center on my location" aria-label="Re-center on my location">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
  </div>

  <main id="list-section" aria-label="Infrastructure assets">
    <div class="list-controls">
      <div class="list-header">
        <div>
          <div class="list-count" id="list-count" aria-live="polite">Loading…</div>
          <div id="last-refreshed" aria-live="polite"></div>
        </div>
        <div class="header-actions">
          <button id="filter-toggle-btn" class="filter-btn" onclick="toggleFilterDrawer()" aria-expanded="false" aria-controls="filter-drawer">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
            Filter
          </button>
          <button class="sort-toggle" id="sort-label" onclick="toggleSort()" aria-label="Toggle sort">📍 Nearest</button>
        </div>
      </div>
      <div class="active-filters" id="active-filters" aria-label="Active filters" aria-live="polite"></div>
      <div id="filter-drawer" aria-hidden="true" inert>
        <nav id="filter-grid" aria-label="Filter assets by CISA sector"></nav>
      </div>
    </div>
    <div id="asset-list" role="list" aria-label="Asset results"></div>
  </main>
</div>

<!-- ════════════════════════════════════════════════════════════
     DETAIL SHEET
     ════════════════════════════════════════════════════════════ -->
<div id="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="detail-asset-name" hidden>
  <div id="detail-overlay" onclick="closeDetail()"></div>
  <div id="detail-content">
    <div class="sheet-handle" aria-hidden="true"></div>
    <button class="sheet-close-btn" onclick="closeDetail()" aria-label="Close details">×</button>
    <div id="detail-body"></div>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════
     MAP LAYERS SHEET (reference layers from the dashboard webmap)
     ════════════════════════════════════════════════════════════ -->
<div id="layers-sheet" role="dialog" aria-modal="true" aria-labelledby="layers-title" hidden>
  <div id="layers-overlay" onclick="closeLayersSheet()"></div>
  <div id="layers-content">
    <div class="sheet-handle" aria-hidden="true"></div>
    <button class="sheet-close-btn" onclick="closeLayersSheet()" aria-label="Close map layers">×</button>
    <div id="layers-body"></div>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════
     EXPORT SHEET (area drawn on the map -> CSV)
     ════════════════════════════════════════════════════════════ -->
<div id="export-sheet" role="dialog" aria-modal="true" aria-labelledby="export-title" hidden>
  <div id="export-overlay" onclick="closeExportSheet()"></div>
  <div id="export-content">
    <div class="sheet-handle" aria-hidden="true"></div>
    <button class="sheet-close-btn" onclick="closeExportSheet()" aria-label="Close export">×</button>
    <div id="export-body"></div>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════
     LIGHTBOX (for attachment images)
     ════════════════════════════════════════════════════════════ -->
<div id="lightbox" hidden onclick="closeLightbox()">
  <button class="close" onclick="closeLightbox()" aria-label="Close image">×</button>
  <img id="lightbox-img" alt="">
</div>

<script>
// ════════════════════════════════════════════════════════════════
//  CONFIG  — OAuth 2.0 authorization-code-with-PKCE flow
//  ─────────────────────────────────────────────────────
//  clientId comes from the AGOL app registration. redirectUri must
//  exactly match one of the redirect URIs configured for that app
//  (including the trailing slash, if any).
//
//  The app uses PKCE so no client_secret is needed — that's the
//  whole point of registering the AGOL app as a Native Application.
//
//  When the access token expires (~2h) we silently use the refresh
//  token to get a new one. The refresh token itself lasts up to
//  14 days; once that expires the user has to sign in again.
// ════════════════════════════════════════════════════════════════
const CONFIG = {
  serviceUrl:   'https://services1.arcgis.com/kILp9lqGUeOhnDbI/ArcGIS/rest/services/CIKR_TN_OHS_View/FeatureServer/0',
  // OAuth 2.0
  clientId:     'tP3hyVsfaw5Am3BF',

//  COMMUNITY LIFELINES — FEMA's 8 categories
//  Used as the primary filter pills. Colors picked for WCAG AA on

// ════════════════════════════════════════════════════════════════
// LIFELINES — FEMA's 8 categories, kept as SECONDARY info (detail sheet, card badge,
// search). The primary classification + icon is the CISA sector — see SECTORS below.
const LIFELINES = {
  safety:   { label:'Safety & Security',   color:'#a8311f', desc:'Law enforcement, fire, search & rescue, government services, community safety.' },
  food:     { label:'Food, Hydration, Shelter', color:'#8a6500', desc:'Food, drinking water, shelter, and agriculture systems.' },
  health:   { label:'Health & Medical',    color:'#a83299', desc:'Hospitals, EMS, public health, medical supply chain, fatality management.' },
  energy:   { label:'Energy (Power & Fuel)', color:'#d35400', desc:'Power generation and distribution, fuel, energy systems.' },
  comms:    { label:'Communications',      color:'#7d3c98', desc:'Voice, internet, broadcasting, alerts & warnings, financial systems.' },
  trans:    { label:'Transportation',      color:'#404040', desc:'Highways, mass transit, aviation, maritime, rail, pipeline.' },
  hazmat:   { label:'Hazardous Materials', color:'#1e8449', desc:'Facilities, hazardous debris and pollutants, hazardous material.' },
  water:    { label:'Water Systems',       color:'#1f618d', desc:'Drinking water, wastewater systems, water infrastructure.' },
};

// Map raw lifeline string from the service into one of the 8 keys above.
// Substring match so variants like "Energy (Power & Fuel)" or
// "Food, Hydration, and Shelter" all land on the right key.
function normaliseLifeline(raw) {
  if (!raw) return null;
  const s = String(raw).toLowerCase();
  if (s.includes('safety') || s.includes('security'))            return 'safety';
  if (s.includes('food')   || s.includes('shelter') || s.includes('hydration')) return 'food';
  if (s.includes('health') || s.includes('medical'))             return 'health';
  if (s.includes('energy') || s.includes('power') || s.includes('fuel')) return 'energy';
  if (s.includes('commun') || s.includes('telecom'))             return 'comms';
  if (s.includes('transp') || s.includes('aviation') || s.includes('rail') || s.includes('highway')) return 'trans';
  if (s.includes('hazard') || s.includes('hazmat'))              return 'hazmat';
  if (s.includes('water')  || s.includes('wastewater'))          return 'water';
  return null; // unknown — shown under a neutral fallback
}

(function injectSectorIconCss() {

    .map(k => `.sico-${k}{background-image:url("${SECTOR_ICON_URIS[k]}")}`).join('\n');

// Lifeline -> default sector, used only when the sector field is blank or
// unrecognised so a record still gets a sensible icon instead of a gray dot.
const LIFELINE_TO_SECTOR = {
  safety:'emergency', food:'food', health:'health', energy:'energy',
  comms:'comms', trans:'transport', hazmat:'chemical', water:'water',
};

// Ordered most-specific first. Tolerates CISA's official names
// ("Water and Wastewater Systems", "Healthcare and Public Health", ...) and
// shorthand people actually type ("IT", "Gov", "Comms").
const SECTOR_PATTERNS = [
  ['nuclear',       /nuclear|radiolog/],
  ['chemical',      /chemical/],
  ['dams',          /\bdams?\b|levee/],
  ['defense',       /defense|\bdib\b|military/],
  ['financial',     /financ|bank|credit union|insurance/],
  ['food',          /food|agricult|farm/],
  ['health',        /health|medical|hospital|public health/],
  ['it',            /information tech|\bit\b|cyber|data center/],
  ['comms',         /communicat|telecom|broadcast|\bcomms?\b/],
  ['manufacturing', /manufactur/],
  ['commercial',    /commercial/],
  ['government',    /government|\bgov\b|\bgovt\b/],
  ['emergency',     /emergency|law enforcement|fire|\bems\b|\beoc\b/],
  ['transport',     /transport|aviation|airport|rail|highway|maritime|transit|bridge/],
  ['energy',        /energy|electric|power|petroleum|fuel|gas\b|pipeline/],
  ['water',         /water/],
];
const _unmatchedSectors = new Set();
function normaliseSector(raw, lifelineKey) {
  const s = String(raw || '').trim().toLowerCase();
  if (s) {
    for (const [key, re] of SECTOR_PATTERNS) if (re.test(s)) return key;
    if (!_unmatchedSectors.has(s)) {           // log each odd value once so data can be cleaned up
      _unmatchedSectors.add(s);
      console.info('[Critical2TN] unrecognised CISA sector value:', raw);
    }
  }
  return LIFELINE_TO_SECTOR[lifelineKey] || null;
}

const UNKNOWN_SECTOR = { key:'unknown', label:'Other', short:'Other', color:'#666666', ink:'#555555', desc:'' };

// One call everywhere (cards, markers, popups, detail sheet). Works on
// assets cached by older app versions too (they have no sectorKey).
function sectorOf(a) {
  const key = a.sectorKey || normaliseSector(a.sector, a.lifeline);
  const s = SECTORS[key];
  if (s) return { key, ...s };
  return { ...UNKNOWN_SECTOR, label: a.sector || a.lifelineRaw || 'Other' };
}

// Icon element: a CSS-class circle (no per-marker image data).
function iconHTML(key, size, extraStyle) {
  return `<span class="sico sico-${SECTORS[key] ? key : 'unknown'}" aria-hidden="true" style="width:${size}px;height:${size}px;${extraStyle || ''}"></span>`;
}

// ════════════════════════════════════════════════════════════════
//  AUTH — OAuth 2.0 with PKCE + silent refresh
//  --------------------------------------------------------------
//  Token shape (what we cache):
//    { accessToken, refreshToken, expiresAt, refreshExpiresAt, username }
//  expiresAt / refreshExpiresAt are absolute epoch ms so we can check
//  freshness without re-deriving from the AGOL response.
// ════════════════════════════════════════════════════════════════
let TOKEN = null;

// ── PKCE helpers ─────────────────────────────────────────────────
function _randomString(byteLen = 48) {
  const arr = new Uint8Array(byteLen);
  crypto.getRandomValues(arr);
  return _base64url(arr);
}
function _base64url(buf) {
  const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  let str = '';
  for (let i = 0; i < bytes.length; i++) str += String.fromCharCode(bytes[i]);
  return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function _sha256base64url(s) {
  const buf  = new TextEncoder().encode(s);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return _base64url(new Uint8Array(hash));
}

// ── Token cache helpers ──────────────────────────────────────────
function loadStoredToken() {
  try {
    const raw = localStorage.getItem(CONFIG.tokenKey);
    if (!raw) return null;
    const t = JSON.parse(raw);
    if (!t.accessToken || !t.expiresAt) return null;
    return t;
  } catch { return null; }
}
function saveToken(t) {
  TOKEN = t;
  localStorage.setItem(CONFIG.tokenKey, JSON.stringify(t));
}
function clearStoredToken() {
  TOKEN = null;
  localStorage.removeItem(CONFIG.tokenKey);
  // Clear PKCE breadcrumbs too so a half-finished flow doesn't haunt us
  sessionStorage.removeItem('oauth_verifier');
  sessionStorage.removeItem('oauth_state');
}
function _tokenFromResponse(data) {
  // AGOL returns access_token, expires_in (seconds), refresh_token,
  // refresh_token_expires_in (seconds), username, ssl. expires_in can
  // arrive as a number OR a string depending on the org config.
  const now = Date.now();
  const expSec  = Number(data.expires_in) || 7200;
  const refSec  = Number(data.refresh_token_expires_in) || 0;
  return {
    accessToken:      data.access_token,
    refreshToken:     data.refresh_token || (TOKEN && TOKEN.refreshToken) || null,
    expiresAt:        now + expSec * 1000,
    refreshExpiresAt: refSec ? now + refSec * 1000 : (TOKEN && TOKEN.refreshExpiresAt) || null,
    username:         data.username || (TOKEN && TOKEN.username) || null,
  };
}

// Detect whether the app is loaded inside an iframe (e.g. Experience
// Builder). Uses a try/catch because cross-origin parents throw when
// you read window.top in some browsers.
function isInIframe() {
  try { return window.self !== window.top; } catch { return true; }
}

// Pre-built authorize URL (with PKCE values stashed in sessionStorage)
// so the popup AND the fallback "open in new tab" link share the same
// verifier — otherwise whichever one the user clicks second would have
// stale PKCE values and the token exchange would fail.
let _preparedAuthUrl = null;

// ── OAuth flow: kick off the authorize step ──────────────────────
//   • Standalone (regular tab): redirect the whole page.
//   • Embedded in an iframe (Experience Builder): redirect inside the
//     iframe is blocked because AGOL's login page sets X-Frame-Options.
//     Instead, we open a popup window (top-level browser context) and
//     pipe the auth code back via postMessage.
//
// IMPORTANT: when opening a popup, window.open() must run in the same
// synchronous tick as the user's click — otherwise the browser sees it
// as "programmatic" and blocks it. That's why this function is NOT
// async at the top level: it opens the popup first (sync), then does
// the async crypto in a follow-up Promise that navigates the popup to
// the actual auth URL once it's ready.
function startOAuthFlow() {
  if (isInIframe()) {
    // Sync: open the popup immediately while we still have user
    // activation. We point it at about:blank because the auth URL
    // isn't ready yet — the PKCE challenge is async.
    const w = 540, h = 720;
    const left = Math.max(0, (screen.width  - w) / 2);
    const top  = Math.max(0, (screen.height - h) / 2);
    const popup = window.open(
      'about:blank', 'critical2tn_oauth',
      `width=${w},height=${h},left=${left},top=${top},toolbar=0,menubar=0,scrollbars=1`
    );
    if (!popup) {
      setLoginError('Popup was blocked — please allow popups for this site, then click Sign in again.');
      return;
    }
    // Show a loading hint inside the popup while we prep the auth URL
    try {
      popup.document.write(
        '<!doctype html><meta charset="utf-8"><title>Signing in…</title>' +
        '<style>body{font-family:system-ui,sans-serif;padding:40px;text-align:center;color:#333;background:#f0f2f5}' +
        '.s{margin-top:20px;color:#666;font-size:13px}</style>' +
        '<div><strong>Connecting to ArcGIS Online…</strong><div class="s">One moment.</div></div>'
      );
    } catch { /* cross-origin popup just before nav — fine to ignore */ }
    // Use the URL pre-built when the login screen mounted if we have
    // one — keeps PKCE values consistent with the fallback link. Else
    // build a fresh one.
    const urlPromise = _preparedAuthUrl
      ? Promise.resolve(_preparedAuthUrl)
      : _buildAuthorizeUrl();
    urlPromise
      .then(url => { popup.location.href = url; })
      .catch(err => {
        try { popup.close(); } catch {}
        console.error('OAuth start failed:', err);
        setLoginError('Could not start sign-in. ' + (err.message || ''));
      });
    _waitForOAuthResult(popup);
  } else {
    // Standalone — full-page redirect
    const urlPromise = _preparedAuthUrl
      ? Promise.resolve(_preparedAuthUrl)
      : _buildAuthorizeUrl();
    urlPromise
      .then(url => { window.location.href = url; })
      .catch(err => {
        console.error('OAuth start failed:', err);
        setLoginError('Could not start sign-in. ' + (err.message || ''));
      });
  }
}

// Generate PKCE values, store them, and return the AGOL authorize URL.
async function _buildAuthorizeUrl() {
  const verifier  = _randomString(48);
  const challenge = await _sha256base64url(verifier);
  const state     = _randomString(16);
  sessionStorage.setItem('oauth_verifier', verifier);
  sessionStorage.setItem('oauth_state',    state);
  const params = new URLSearchParams({
    client_id:             CONFIG.clientId,
    response_type:         'code',
    redirect_uri:          CONFIG.redirectUri,
    code_challenge:        challenge,
    code_challenge_method: 'S256',
    expiration:            String(CONFIG.tokenExpirationMinutes),
    state,
  });
  return `${CONFIG.authorizeUrl}?${params}`;
}

// Listen for the popup posting its auth result back, exchange the code
// for tokens, and hand off to startApp().
function _waitForOAuthResult(popup) {
  let settled = false;
  const cleanup = () => {
    window.removeEventListener('message', onMessage);
    clearInterval(closedTimer);
  };
  const onMessage = async (event) => {
    if (event.origin !== window.location.origin) return;
    if (!event.data || event.data.type !== 'critical2tn_oauth') return;
    settled = true;
    cleanup();
    if (event.data.error) {
      setLoginError(event.data.error_description || event.data.error);
      return;
    }
    try {
      const tok = await exchangeCodeForToken(event.data.code);
      saveToken(tok);
      hideLogin();
      startApp();
    } catch (err) {
      console.error('Token exchange failed:', err);
      setLoginError(err.message || 'Sign-in failed.');
    }
  };
  window.addEventListener('message', onMessage);
  const closedTimer = setInterval(() => {
    if (popup.closed && !settled) {
      cleanup();
      // Don't show an error if the user just dismissed it
    }
  }, 500);
}

// ── OAuth flow: exchange the authorization code for tokens ──────
async function exchangeCodeForToken(code) {
  const verifier = sessionStorage.getItem('oauth_verifier');
  if (!verifier) throw new Error('Missing PKCE verifier — please sign in again.');
  const params = new URLSearchParams({
    client_id:     CONFIG.clientId,
    grant_type:    'authorization_code',
    code,
    redirect_uri:  CONFIG.redirectUri,
    code_verifier: verifier,
    f:             'json',
  });
  const res  = await fetch(CONFIG.tokenUrl, { method: 'POST', body: params });
  const data = await res.json();
  if (data.error) {
    const msg = (data.error.details && data.error.details[0]) || data.error.message || 'Sign-in failed';
    throw new Error(msg);
  }
  if (!data.access_token) throw new Error('No access token returned');
  // Done with the verifier — clean up so it can't be replayed
  sessionStorage.removeItem('oauth_verifier');
  sessionStorage.removeItem('oauth_state');
  return _tokenFromResponse(data);
}

// ── Silent refresh ──────────────────────────────────────────────
async function refreshAccessToken() {
  if (!TOKEN || !TOKEN.refreshToken) throw new Error('No refresh token available');
  if (TOKEN.refreshExpiresAt && Date.now() > TOKEN.refreshExpiresAt) {
    throw new Error('Refresh token expired');
  }
  const params = new URLSearchParams({
    client_id:     CONFIG.clientId,
    grant_type:    'refresh_token',
    refresh_token: TOKEN.refreshToken,
    f:             'json',
  });
  const res  = await fetch(CONFIG.tokenUrl, { method: 'POST', body: params });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || 'Token refresh failed');
  if (!data.access_token) throw new Error('No access token in refresh response');
  return _tokenFromResponse(data);
}

// Ensure the in-memory access token is fresh; refresh it if it's near
// expiry. Throws if refresh fails — callers should fall back to login.
async function ensureFreshToken() {
  if (!TOKEN) throw new Error('Not signed in');
  if (TOKEN.expiresAt && Date.now() < TOKEN.expiresAt - CONFIG.refreshBufferMs) return;
  const fresh = await refreshAccessToken();
  saveToken(fresh);
}

// ════════════════════════════════════════════════════════════════
//  LOGIN UI
// ════════════════════════════════════════════════════════════════
const loginScreen = () => document.getElementById('login-screen');
const appShell    = () => document.getElementById('app');

function showLogin() {
  loginScreen().hidden = false;
  appShell().hidden = true;
  setTimeout(() => {
    const btn = document.getElementById('oauth-signin-btn');
    if (btn) btn.focus();
  }, 80);
  // Pre-build the OAuth authorize URL so the "Open in a new tab"
  // fallback link is a real <a href=...> the moment the user clicks it
  // — anchor clicks with target=_blank are exempt from popup blockers
  // (unlike JS-driven window.open after an async crypto step). Only
  // shown when the app is embedded; standalone uses a full-page redirect.
  const fallback = document.getElementById('oauth-fallback');
  if (fallback) {
    if (isInIframe()) {
      _buildAuthorizeUrl().then(url => {
        _preparedAuthUrl = url;
        fallback.href = url;
        fallback.hidden = false;
      }).catch(err => {
        console.warn('Could not pre-build auth URL:', err);
      });
    } else {
      fallback.hidden = true;
    }
  }
}

function hideLogin() {
  loginScreen().hidden = true;
  appShell().hidden = false;
}

function setLoginError(msg) {
  const el = document.getElementById('login-error');
  if (!el) return;
  if (!msg) { el.classList.remove('visible'); el.textContent = ''; return; }
  el.classList.add('visible');
  el.textContent = msg;
}

function confirmLogout() {
  if (!confirm('Sign out and clear the cached session?')) return;
  clearStoredToken();
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  showLogin();
}

// Handle the OAuth redirect callback. Returns true if we consumed a
// `?code=...` from the URL, false if the page loaded normally.
//
// Two modes:
//   • Popup mode (window.opener exists): we're the popup that AGOL
//     just bounced back to with the auth code. Send the code to the
//     opener (the embedded app) via postMessage and close the popup.
//   • Top-level mode: we're the standalone app — exchange the code
//     ourselves and proceed.
async function handleOAuthCallback() {
  const url = new URL(window.location.href);
  const code  = url.searchParams.get('code');
  const state = url.searchParams.get('state');
  const error = url.searchParams.get('error');
  if (!code && !error) return false;

  // Popup branch — relay to opener and close.
  if (window.opener && window.opener !== window) {
    try {
      window.opener.postMessage({
        type:               'critical2tn_oauth',
        code,
        state,
        error,
        error_description:  url.searchParams.get('error_description') || null,
      }, window.location.origin);
    } catch (e) { console.error('postMessage to opener failed:', e); }
    // Give the parent a tick to receive the message, then close
    setTimeout(() => { try { window.close(); } catch {} }, 50);
    // Show a brief "you can close this" message in case window.close fails
    document.body.innerHTML = '<div style="font-family:DM Sans,sans-serif;padding:40px;text-align:center;color:#333">Sign-in complete. You can close this window.</div>';
    return true;  // don't continue normal app boot
  }

  // Standalone branch — exchange the code in this same page.
  if (error) {
    setLoginError(`Sign-in error: ${url.searchParams.get('error_description') || error}`);
    history.replaceState({}, '', url.pathname);
    return false;
  }
  // CSRF check — the state we sent must match what came back
  const expectedState = sessionStorage.getItem('oauth_state');
  if (expectedState && state !== expectedState) {
    setLoginError('Sign-in failed: state mismatch. Please try again.');
    history.replaceState({}, '', url.pathname);
    return false;
  }
  try {
    const tok = await exchangeCodeForToken(code);
    saveToken(tok);
    history.replaceState({}, '', url.pathname);
    return true;
  } catch (err) {
    console.error('Token exchange failed:', err);
    setLoginError(err.message || 'Sign-in failed.');
    history.replaceState({}, '', url.pathname);
    return false;
  }
}

// ════════════════════════════════════════════════════════════════
//  DATA FETCHING
// ════════════════════════════════════════════════════════════════
function featureToAsset(feature) {
  const p   = feature.attributes;
  const lat = p[FIELDS.lat] ?? (feature.geometry ? feature.geometry.y : null);
  const lng = p[FIELDS.lng] ?? (feature.geometry ? feature.geometry.x : null);
  const lifelineKey = normaliseLifeline(p[FIELDS.lifeline]);
  return {
    objectId:    p[FIELDS.objectId],
    name:        p[FIELDS.name]         || 'Unnamed asset',
    hsipId:      p[FIELDS.hsipId]       || '',
    address:     p[FIELDS.address]      || '',
    city:        p[FIELDS.city]         || '',
    state:       p[FIELDS.state]        || 'TN',
    zip:         p[FIELDS.zip]          || '',
    county:      p[FIELDS.county]       || '',
    region:      p[FIELDS.region]       || '',
    assetType:   p[FIELDS.assetType]    || '',
    lifelineRaw: p[FIELDS.lifeline]     || '',
    lifeline:    lifelineKey,
    sectorKey:   normaliseSector(p[FIELDS.sector], lifelineKey),
    component:   p[FIELDS.component]    || '',
    subcomp:     p[FIELDS.subcomponent] || '',
    sector:      p[FIELDS.sector]       || '',
    contactName:   p[FIELDS.contactName]   || '',
    contactAgency: p[FIELDS.contactAgency] || '',
    contactPhone:  p[FIELDS.contactPhone]  || '',
    contactEmail:  p[FIELDS.contactEmail]  || '',
    lat, lng,
    distance:    null,
  };
}

async function arcgisFetch(url, _retried) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (data.error) {
    // 498 = invalid token, 499 = token required.
    // If we have a refresh token, try refreshing once and retry the call
    // before bouncing the user back to the login screen.
    if ((data.error.code === 498 || data.error.code === 499) && !_retried && TOKEN && TOKEN.refreshToken) {
      try {
        const fresh = await refreshAccessToken();
        saveToken(fresh);
        const newUrl = url.replace(/([?&]token=)[^&]+/, `$1${encodeURIComponent(fresh.accessToken)}`);
        return arcgisFetch(newUrl, true);
      } catch (e) {
        // Fall through to expired-token handling below
      }
    }
    if (data.error.code === 498 || data.error.code === 499) {
      const err = new Error('Token expired or invalid');
      err.tokenExpired = true;
      throw err;
    }
    throw new Error(`ArcGIS error ${data.error.code}: ${data.error.message}`);
  }
  return data;
}

async function fetchAssets() {
  if (!TOKEN) { showLogin(); return; }
  // Refresh proactively so background ticks don't fail with 498 first
  try { await ensureFreshToken(); }
  catch (err) {
    console.warn('Token refresh failed before fetch:', err);
    clearStoredToken();
    showLogin();
    return;
  }
  setLoadingState(true);
  const outFields = Object.values(FIELDS).join(',');
  // AGOL hosted feature services cap a single query at maxRecordCount
  // (default 1,000 or 2,000 depending on org). To pull every record we
  // page with resultOffset until either the server reports it has no
  // more (`exceededTransferLimit === false`) or returns an empty page.
  // We use a generous page size so the average dataset finishes in 1–3
  // round-trips; the server will silently cap to its own limit anyway.
  const pageSize = 2000;
  try {
    const allFeatures = [];
    let offset = 0;
    let more = true;
    let safety = 50;   // hard cap: never make more than 50 paged requests
    while (more && safety-- > 0) {
      const params = new URLSearchParams({
        where:             '1=1',
        outFields,
        returnGeometry:    'true',
        outSR:             '4326',
        f:                 'json',
        resultOffset:      String(offset),
        resultRecordCount: String(pageSize),
        token:             TOKEN.accessToken,
      });
      const data = await arcgisFetch(`${CONFIG.serviceUrl}/query?${params}`);
      const feats = data.features || [];
      allFeatures.push(...feats);
      // Update the count progressively so the user sees data flowing in
      document.getElementById('list-count').textContent = `Loading… ${allFeatures.length}`;
      // Two ways to know we're done: server says "no more" (preferred),
      // or we got fewer rows than we asked for (fallback).
      more = (data.exceededTransferLimit === true) || (feats.length === pageSize);
      offset += feats.length;
      if (feats.length === 0) break;
    }
    if (safety <= 0) console.warn('[Critical2TN] paging hit safety cap — some records may not have loaded');
    // Diagnostic: log the field names + sample values on the first
    // feature so it's easy to confirm contact_* fields are actually
    // being returned by the view. Open DevTools console to see this.
    if (allFeatures.length) {
      const sample = allFeatures[0].attributes || {};
      const hasContact = ['contact_name','contact_agency','contact_phone','contact_email']
        .some(k => sample[k] != null && sample[k] !== '');
      console.info('[Critical2TN] first feature attribute keys:', Object.keys(sample));
      console.info('[Critical2TN] first feature contact values:', {
        contact_name:   sample.contact_name,
        contact_agency: sample.contact_agency,
        contact_phone:  sample.contact_phone,
        contact_email:  sample.contact_email,
        anyPresent:     hasContact,
      });
    }
    const raw = allFeatures.map(featureToAsset)
                  .filter(a => Number.isFinite(a.lat) && Number.isFinite(a.lng));
    assets = raw.map((a, idx) => ({
      ...a,
      id: `a${idx}`,
      distance: (userLat !== null) ? haversine(userLat, userLng, a.lat, a.lng) : null,
    }));
    setLoadingState(false);
    setOfflineBanner(false);
    cacheData(assets);
    renderedList = getFiltered();
    document.getElementById('list-count').textContent = `${renderedList.length} asset${renderedList.length !== 1 ? 's' : ''}`;
    refreshMarkers();
    renderList();
    updateLastRefreshed(false);
  } catch (err) {
    console.error('Fetch failed:', err);
    setLoadingState(false);
    if (err.tokenExpired) {
      // Token died — push back to login, but keep last-known data on screen
      clearStoredToken();
      alert('Your session has expired. Please sign in again.');
      showLogin();
      return;
    }
    // Network error — fall back to cached data if any
    const cached = loadCachedData();
    if (cached && cached.assets && cached.assets.length) {
      assets = cached.assets.map(a => ({
        ...a,
        distance: (userLat !== null) ? haversine(userLat, userLng, a.lat, a.lng) : a.distance,
      }));
      renderedList = getFiltered();
      document.getElementById('list-count').textContent = `${renderedList.length} asset${renderedList.length !== 1 ? 's' : ''}`;
      refreshMarkers();
      renderList();
      updateLastRefreshed(true, cached.ts);
      setOfflineBanner(true);
    } else {
      showError(`Could not load assets.<br><small>${err.message}</small>`);
    }
  }
}

// ── Attachments ─────────────────────────────────────────────────
// Layer capability flag — set the first time fetchLayerMeta() runs.
// `null` means "haven't checked yet"; `true`/`false` is the answer.
let LAYER_HAS_ATTACHMENTS = null;
let LAYER_META_ERROR = null;

async function fetchLayerMeta() {
  if (LAYER_HAS_ATTACHMENTS !== null) return;
  if (!TOKEN) return;
  const url = `${CONFIG.serviceUrl}?f=json&token=${encodeURIComponent(TOKEN.accessToken)}`;
  try {
    const data = await arcgisFetch(url);
    LAYER_HAS_ATTACHMENTS = data.hasAttachments === true;
    console.info('[Critical2TN] layer hasAttachments =', LAYER_HAS_ATTACHMENTS);
  } catch (err) {
    LAYER_META_ERROR = err.message || String(err);
    console.warn('[Critical2TN] failed to read layer metadata:', err);
  }
}

async function fetchAttachmentInfo(objectId) {
  if (!TOKEN) return { state: 'error', message: 'Not signed in', infos: [] };
  try { await ensureFreshToken(); }
  catch (err) { return { state: 'error', message: 'Session expired — sign in again', infos: [] }; }

  // Diagnostic: log everything about the attempt so we can see exactly
  // what the server returned. Open DevTools → Console to read this.
  console.group(`[Critical2TN] attachments: objectId=${objectId}`);
  console.info('serviceUrl:', CONFIG.serviceUrl);
  console.info('LAYER_HAS_ATTACHMENTS:', LAYER_HAS_ATTACHMENTS);

  // Try in order of reliability: queryAttachments (works on most views),
  // then the per-feature /attachments endpoint as a fallback. We DON'T
  // gate on LAYER_HAS_ATTACHMENTS — that flag is sometimes wrong on
  // views, and it's better to attempt the query and show a real error
  // than to silently say "no attachments".
  const attempts = [
    {
      name: 'queryAttachments',
      url: `${CONFIG.serviceUrl}/queryAttachments?` + new URLSearchParams({
        objectIds: String(objectId),
        returnUrl: 'true',
        f:         'json',
        token:     TOKEN.accessToken,
      }),
      parse: (data) => {
        const groups = data.attachmentGroups || [];
        const group  = groups.find(g => String(g.parentObjectId) === String(objectId)) || groups[0];
        return (group && group.attachmentInfos) || [];
      },
    },
    {
      name: 'per-feature /attachments',
      url: `${CONFIG.serviceUrl}/${objectId}/attachments?f=json&token=${encodeURIComponent(TOKEN.accessToken)}`,
      parse: (data) => data.attachmentInfos || [],
    },
  ];

  let lastErr = null;
  for (const attempt of attempts) {
    console.info(`trying ${attempt.name}:`, attempt.url);
    try {
      const res = await fetch(attempt.url);
      const data = await res.json();
      console.info(`${attempt.name} response:`, data);
      if (data.error) {
        lastErr = new Error(`${attempt.name}: ${data.error.code} ${data.error.message}`);
        continue;
      }
      const raw = attempt.parse(data) || [];
      console.info(`${attempt.name} parsed ${raw.length} attachment(s)`);
      const infos = raw.map(a => {
        let attUrl = a.url || `${CONFIG.serviceUrl}/${objectId}/attachments/${a.id}`;
        if (!/[?&]token=/.test(attUrl)) {
          attUrl += (attUrl.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN.accessToken);
        }
        return {
          id:          a.id,
          name:        a.name,
          contentType: a.contentType,
          size:        a.size,
          url:         attUrl,
          isImage:     (a.contentType || '').startsWith('image/'),
        };
      });
      console.groupEnd();
      return { state: 'ok', infos };
    } catch (err) {
      console.warn(`${attempt.name} threw:`, err);
      lastErr = err;
    }
  }
  console.groupEnd();
  return {
    state:   'error',
    message: lastErr ? lastErr.message : 'Could not load attachments (both endpoints failed).',
    infos:   [],
  };
}

// ── Cache (offline support) ─────────────────────────────────────
function cacheData(list) {
  try {
    const payload = { ts: Date.now(), assets: list };
    localStorage.setItem(CONFIG.cacheKey, JSON.stringify(payload));
  } catch (e) { /* quota — ignore */ }
}
function loadCachedData() {
  try {
    const raw = localStorage.getItem(CONFIG.cacheKey);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

// ── Status helpers ──────────────────────────────────────────────
function setLoadingState(loading) {
  document.getElementById('loading-bar').style.display = loading ? 'block' : 'none';
  if (loading && assets.length === 0) document.getElementById('list-count').textContent = 'Loading…';
}
function updateLastRefreshed(stale, ts) {
  const when = stale && ts ? new Date(ts) : new Date();
  const t = when.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  document.getElementById('last-refreshed').innerHTML = `Updated ${t}${stale ? ' <span class="stale-badge">CACHED</span>' : ''}`;
}
function setOfflineBanner(on) {
  document.getElementById('offline-banner').hidden = !on;
}
function showError(msg) {
  document.getElementById('asset-list').innerHTML =
    `<div class="empty-state"><div class="icon">⚠️</div><p>${msg}</p>
     <button onclick="fetchAssets()" style="margin-top:14px;padding:10px 20px;background:var(--tema-blue);color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif">Retry</button></div>`;
}

function buildFilterGrid() {
  const allBtn = `
    <button class="fgt active" data-key="all" aria-pressed="true" onclick="setFilter(this,'all')">
      <div class="fgt-icon" aria-hidden="true"><svg viewBox="0 0 26 26" width="26" height="26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="#fff"/><circle cx="13" cy="13" r="10" fill="#002868"/><circle cx="13" cy="13" r="4.5" fill="#fff"/></svg></div>
      <div class="fgt-label">All</div>
      <div class="fgt-count" id="fgc-all"></div>
    </button>`;
  const others = Object.entries(SECTORS).map(([key, s]) => `
    <button class="fgt" data-key="${key}" aria-pressed="false" onclick="setFilter(this,'${key}')" aria-label="Filter: ${s.label}">
      <div class="fgt-icon" aria-hidden="true">${iconHTML(key, 28)}</div>

// Per-sector counts on the tiles. Sectors with nothing visible to this user
// (e.g. a county account) are dimmed so the list of choices stays honest.
function updateFilterCounts() {
  const counts = {};
  for (const a of assets) { const k = sectorOf(a).key; counts[k] = (counts[k] || 0) + 1; }
  const set = (id, n) => { const el = document.getElementById(id); if (el) el.textContent = n ? n.toLocaleString() : ''; };
  set('fgc-all', assets.length);
  Object.keys(SECTORS).forEach(k => {
    set('fgc-' + k, counts[k] || 0);
    const tile = document.querySelector(`.fgt[data-key="${k}"]`);
    if (tile) tile.classList.toggle('empty', !counts[k]);
  });
}

function toggleFilterDrawer(forceClose = false) {
  const drawer = document.getElementById('filter-drawer');
  const btn    = document.getElementById('filter-toggle-btn');
  const isOpen = drawer.classList.contains('open');
  if (forceClose || isOpen) {
    drawer.classList.remove('open');
    drawer.setAttribute('aria-hidden', 'true');
    drawer.setAttribute('inert', '');
    btn.setAttribute('aria-expanded', 'false');
  } else {
    drawer.classList.add('open');
    drawer.setAttribute('aria-hidden', 'false');
    drawer.removeAttribute('inert');
    btn.setAttribute('aria-expanded', 'true');
  }
}

function setFilter(el, key) {
  document.querySelectorAll('.fgt').forEach(c => { c.classList.remove('active'); c.setAttribute('aria-pressed', 'false'); });
  el.classList.add('active'); el.setAttribute('aria-pressed', 'true');
  activeFilter = key;
  updateActiveFilterBar();
  renderList();
  if (key !== 'all') toggleFilterDrawer(true);
}

function clearTypeFilter() {
  const allBtn = document.querySelector('.fgt[data-key="all"]');
  document.querySelectorAll('.fgt').forEach(c => { c.classList.remove('active'); c.setAttribute('aria-pressed', 'false'); });
  if (allBtn) { allBtn.classList.add('active'); allBtn.setAttribute('aria-pressed', 'true'); }
  activeFilter = 'all';
  updateActiveFilterBar();
  renderList();
